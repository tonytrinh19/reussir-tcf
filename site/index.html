:root {

  --accent-deep: #0C4A90;
  --accent-ink: #FFFFFF;
  --accent-soft: #E5EEF9;
  --red: #C62F24;
  --red-soft: #FCEAE6;
  --green: #2A7349;
  --green-soft: #E3F2E7;
  --on-green: #FFFFFF;
  --amber: #8F5C08;
  --amber-soft: #FAEFD8;

  --c-grid: #EFE7DA;

  --pen: var(--red);
  --tile-bg: #FFFFFF; --tile-l1: #E2E7EE; --tile-l2: #C3CCD8; --tile-m: #E58A80; --tile-e: #1565C0; --tile-leaf: #C62F24; --tile-edge: #D3D9E0;
  --fur: #9D958E; --fur-dark: #766D67; --muzzle: #EEE7E0; --ear-in: #F0AAA5; --m-ink: #2B1D15; --m-nose: #E07A87; --tail: #E6A19C; --tooth: #FFFDF6; --blush: #EE9A8F;
  --leaf-1: #4E9A57; --leaf-2: #DE9F1A; --leaf-3: #E06A22; --leaf-4: #C62F24;

  /* Fiches: the sticky notes' four papers, and the blue-ink highlighter. */

  --hl: rgba(21, 101, 192, .18);

  --c-co: #1A9AB0; --c-voc: #C98500; --c-ee: #9378E0; --c-ce: #3AA862; --c-gra: #3D86E0; --c-bil: #D9658C;
  --o-1: #1C5CAB; --o-2: #2A78D6; --o-3: #6DA7EC; --o-4: #B7D3F6;
  --c-grid: #332D27;
  --tile-bg: #2A2621; --tile-l1: #35302A; --tile-l2: #443D35; --tile-m: #8C4239; --tile-e: #7DB6F7; --tile-leaf: #FF7C70; --tile-edge: #4A4239;
  --fur: #A8A099; --muzzle: #E8E1DA; --blush: #D98479;

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15.5px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
a { color: var(--accent); text-underline-offset: .18em; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .btn:hover, .btn:active, .daychip:hover, .daychip:active, .choices button:hover, .choices button:active { transform: none !important; }
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: 26px 16px 20px; border-right: 1px solid var(--rule); background: var(--paper); }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); padding: 0 6px; min-width: 0; }
.brand .tile { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 2px 3px rgb(var(--shade) / .14)); transition: transform var(--dur) var(--ease); }
.brand:hover .tile { transform: rotate(-6deg) scale(1.05); }
.theme-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1.5px solid var(--rule-2); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer; white-space: nowrap; transition: color var(--dur-fast), border-color var(--dur-fast); }
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.theme-btn svg { width: 14px; height: 14px; flex: none; }
.theme-btn .tb-l { display: grid; gap: 3px; text-align: left; }
.theme-btn small { font-size: 11px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rail-foot .theme-btn { justify-self: start; }
.rail-top .theme-btn { display: none; }
.brand b { display: block; font: 800 18.5px/1.1 var(--f-ui); letter-spacing: -.015em; }
.brand small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-top: 3px; }
.nav { position: relative; display: grid; gap: 3px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--r); color: var(--ink-2); text-decoration: none; font-weight: 700; font-size: 15px; transition: color var(--dur-fast), background-color var(--dur-fast); }
.nav a .ico { width: 20px; height: 20px; color: var(--ink-3); --pen: currentColor; transition: color var(--dur-fast), transform var(--dur) var(--ease); }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a:hover .ico { transform: translateY(-1px) rotate(-4deg); }
/* The red pen of each icon only shows on the page you're on. */
.nav a:hover .ico, .nav a[aria-current="page"] .ico { color: var(--ink); --pen: var(--red); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--rule); }
/* With motion.js the highlight is one pill that glides to the page you open (it sits behind the links). */
.nav-pill { position: absolute; z-index: 0; left: 0; top: 0; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--rule); pointer-events: none; transition: transform var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease); }
.nav.has-pill a[aria-current="page"] { background: transparent; box-shadow: none; }
.rail-foot { margin-top: auto; display: grid; gap: 10px; padding: 0 4px; font-size: 12.5px; color: var(--ink-3); }
.mini-timer { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font-variant-numeric: tabular-nums; text-decoration: none; }
.mini-timer .ico { width: 16px; height: 16px; }
.mini-timer b { font-size: 16px; margin-left: auto; }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: 1px; }
.status-dot.on { background: var(--green); }
.status-dot.warn { background: var(--amber); }
/* Where your progress is saved, and whether Claude is ready: one line, with the details a tap away. */
.status > summary { display: inline-flex; align-items: center; cursor: pointer; list-style: none; padding: 2px 4px; margin-left: -4px; border-radius: 6px; font-weight: 600; }
.status > summary::-webkit-details-marker { display: none; }
.status > summary:hover { color: var(--ink-2); background: var(--hover); }
.status > div { display: grid; gap: 4px; margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--sunk); }
main { min-width: 0; padding-block: 32px 88px; padding-inline: 44px; }
/* One column that never grows past the page, so a wide row (a tab tray, a table) scrolls inside it instead. */
.wrap { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
/* A task in progress (a drill round, a text to proofread, an exam) gets a narrower page with nothing beside it. */
.wrap.focus { max-width: 760px; gap: 22px; }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: column; gap: 8px; padding: 12px 16px 8px; border-right: 0; border-bottom: 1px solid var(--rule); }
  .brand { padding: 0; gap: 9px; }
  .brand .tile { width: 30px; height: 30px; }
  .brand b { font-size: 17.5px; }
  .brand small { display: none; }
  .nav { grid-auto-flow: column; justify-content: start; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; gap: 4px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; gap: 7px; padding: 7px 12px; font-size: 14px; border-radius: 999px; }
  .nav-pill { border-radius: 999px; }
  .nav a .ico { width: 17px; height: 17px; }
  .rail-foot { display: none; }
  .rail-top .theme-btn { display: inline-flex; padding: 6px 10px; }
  .rail-top .theme-btn small { display: none; }
  main { padding-inline: 16px; padding-block: 20px 64px; }
}

/* ---------- type ---------- */
h1, h2, h3 { text-wrap: balance; margin: 0; }
.title { font: 800 32px/1.12 var(--f-ui); letter-spacing: -.02em; }
.title small { display: block; margin-top: 6px; font: 500 15px/1.45 var(--f-ui); color: var(--ink-2); letter-spacing: 0; }
.h2 { font: 800 20px/1.25 var(--f-ui); letter-spacing: -.01em; }
.h3 { font: 700 15.5px/1.3 var(--f-ui); }
.eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.lede { color: var(--ink-2); max-width: 66ch; margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13.5px; }
.fr { font-family: var(--f-text); }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }
.prose { display: grid; gap: 10px; max-width: 70ch; }

/* ---------- building blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-card); padding: 22px; box-shadow: var(--shadow); }
.panel.flat { box-shadow: none; }
.stack { display: grid; gap: 14px; }
.stack.tight { gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
@media (max-width: 1100px) { .grid-side { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 700px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
section.sec { display: grid; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }

/* Buttons sit on a lip (--lip-h) that presses down when you click. */
.btn { --lip: var(--rule-2); --lip-h: 2px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border-radius: var(--r); border: 1.5px solid var(--rule-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14.5px; line-height: 1.1; cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: 0 var(--lip-h) 0 var(--lip); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast), background-color var(--dur-fast), filter var(--dur-fast); -webkit-tap-highlight-color: transparent; }
.btn.primary { --lip: var(--accent-deep); --lip-h: 3px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { --lip-h: 0px; background: transparent; border-color: transparent; color: var(--accent); padding-inline: 10px; }
.btn.danger { color: var(--red); }
.btn.sm { --lip-h: 2px; padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.sm.ghost { --lip-h: 0px; }
.btn:hover { transform: translateY(-1px); border-color: var(--ink-3); }
.btn.primary:hover { filter: brightness(1.07); border-color: var(--accent); }
.btn.ghost:hover { transform: none; background: var(--accent-soft); border-color: transparent; }
.btn:active { --lip-h: 0px; transform: translateY(2px); }
.btn.ghost:active { transform: scale(.97); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; pointer-events: none; --lip-h: 0px; transform: none; }
.btn .kbd { font-weight: 600; font-size: 11.5px; color: inherit; border-color: currentColor; opacity: .7; }
.kbd { font: 600 11.5px/1 var(--f-ui); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--rule-2); color: var(--ink-3); }

input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  background: var(--surface); border: 1.5px solid var(--rule-2); border-radius: 10px; padding: 9px 12px; min-width: 0; transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
/* Fields light up in blue ink when you type in them; ticks, radios and sliders show a ring from the keyboard only. */
input:focus, select:focus, textarea:focus { outline: none; }
input:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, input[type="search"]:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type="text"]:focus-visible, input[type="number"]:focus-visible, input[type="date"]:focus-visible, input[type="search"]:focus-visible { outline: none; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
label.field { display: grid; gap: 5px; font-size: 13.5px; color: var(--ink-2); font-weight: 700; }
label.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
label.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--green); flex: none; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.bad { background: var(--red-soft); color: var(--red); }
.pill.warn { background: var(--amber-soft); color: var(--amber); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
/* A rule or topic name in a pill (a drill's review, the mixed review's topic) can be long: it wraps instead of widening the page. */
.misses .pill, .drill-q .pill { white-space: normal; border-radius: 10px; }

.sk { --c: var(--sk-bil); display: inline-flex; align-items: center; gap: 5px; font: 800 10.5px/1 var(--f-ui); letter-spacing: .07em; padding: 4px 8px 4px 6px; border-radius: 8px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
.sk .ico { width: 14px; height: 14px; stroke-width: 2; --pen: currentColor; }
.sk.voc { --c: var(--sk-voc); } .sk.gra { --c: var(--sk-gra); } .sk.co { --c: var(--sk-co); } .sk.ce { --c: var(--sk-ce); }
.sk.ee { --c: var(--sk-ee); } .sk.eo { --c: var(--sk-eo); } .sk.bil { --c: var(--sk-bil); }

/* A fold: a short label with a chevron that opens in place ("Comment faire · How it works", "Notes"…). */
.fold-x > summary { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; list-style: none; padding: 3px 6px; margin-left: -6px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-3); transition: color var(--dur-fast), background-color var(--dur-fast); }
.fold-x > summary::-webkit-details-marker { display: none; }
.fold-x > summary::after, .chev { content: ""; display: inline-block; flex: none; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform var(--dur) var(--ease); }
.fold-x[open] > summary::after, details[open] > summary .chev { transform: translateY(1px) rotate(-135deg); }
.fold-x > summary:hover { color: var(--ink); background: var(--hover); }
.fold-x > :not(summary) { margin-top: 8px; }

/* ---------- brand kit: icons, the é tile, Rémy, stamps, the streak leaf, the boarding pass ---------- */
/* Icons: 24 px grid, 1.75 stroke, round ends, in the text colour with one red-pen detail (.pen). */
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; overflow: visible; }
.pen { stroke: var(--pen, currentColor); }
.pen-solid { fill: var(--pen, currentColor); stroke: none; }
.with-ico { display: flex; align-items: center; gap: 8px; }
.with-ico > .ico { width: 20px; height: 20px; }
.h3.with-ico { gap: 7px; }
.h3.with-ico > .ico { width: 18px; height: 18px; }
.with-ico > .leaf-ico { width: 17px; height: 18px; flex: none; }
.tabs .ico { width: 17px; height: 17px; margin-right: 7px; vertical-align: -3px; color: var(--ink-3); --pen: currentColor; }
.tabs [aria-selected="true"] .ico { color: var(--ink); --pen: var(--red); }
.tile { display: block; }
.t-bg { fill: var(--tile-bg); }
.t-l1 { fill: none; stroke: var(--tile-l1); stroke-width: .9; }
.t-l2 { fill: none; stroke: var(--tile-l2); stroke-width: 1.3; }

/* Rémy, le petit chef */
.mascot { display: block; overflow: visible; }
.r-fur { fill: var(--fur); } .r-dark { fill: var(--fur-dark); } .r-belly { fill: var(--muzzle); } .r-earin { fill: var(--ear-in); }
.r-eye { fill: var(--m-ink); } .r-glint { fill: #FFFFFF; } .r-nose { fill: var(--m-nose); } .r-noseshine { fill: #FFFFFF; opacity: .45; }

.r-toqueline { fill: none; stroke: #C9CFD7; stroke-width: 1.2; stroke-linecap: round; }
.r-pin { fill: #C62F24; }
.k-motion { fill: none; stroke: var(--ink-3); stroke-width: 1.8; stroke-linecap: round; }
.k-hp { fill: none; stroke: #0E7490; stroke-width: 5; stroke-linecap: round; } .k-hpc { fill: #0E7490; }
.k-glass { fill: rgba(255, 255, 255, .18); stroke: #16181D; stroke-width: 2; stroke-linecap: round; }
.k-penbody { fill: #C62F24; } .k-pencap { fill: #8F1F18; } .k-pentip { fill: #F3E3D3; stroke: #8F1F18; stroke-width: .8; }
.k-mug { fill: #FFFFFF; stroke: #2B1D15; stroke-width: 1.6; } .k-mugh { fill: none; stroke: #2B1D15; stroke-width: 1.6; } .k-mugleaf { fill: #C62F24; }
.k-steam { fill: none; stroke: var(--ink-3); stroke-width: 1.6; stroke-linecap: round; }
.k-c1 { fill: var(--leaf-2); } .k-c2 { fill: var(--leaf-3); } .k-c3 { fill: var(--leaf-1); } .k-c4 { fill: var(--leaf-4); }
/* Rémy is alive: he blinks, twitches an ear and swishes his tail, and hops when he cheers. Every cycle runs on one
   clock (motion.js sets --clock after each redraw), so redrawing the page doesn't restart them. */
.mascot .r-eyes, .mascot .r-ear, .mascot .r-tail { transform-box: fill-box; }
.mascot .r-eyes { transform-origin: 50% 50%; animation: r-blink 5.2s var(--clock, 0ms) infinite; }
.mascot .r-ear-l { transform-origin: 87% 83%; animation: r-ear-l 7.4s var(--clock, 0ms) infinite; }
.mascot .r-ear-r { transform-origin: 13% 83%; animation: r-ear-r 9.1s var(--clock, 0ms) infinite; }
.mascot .r-tail { transform-origin: 0% 82%; animation: r-tail 3.8s var(--clock, 0ms) ease-in-out infinite; }
.mascot.m-bravo { transform-origin: 50% 100%; animation: r-hop 2.6s var(--clock, 0ms) infinite; }
@keyframes r-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes r-ear-l { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-9deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(0); } }
@keyframes r-ear-r { 0%, 58%, 100% { transform: rotate(0); } 62% { transform: rotate(8deg); } 66% { transform: rotate(-2deg); } 70% { transform: rotate(0); } }
@keyframes r-tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-9deg); } }
@keyframes r-hop { 0%, 34%, 100% { transform: none; } 8% { transform: translateY(-5px); } 16% { transform: none; } 24% { transform: translateY(-3px); } }
.bubble { position: relative; background: var(--sunk); border-radius: 16px; padding: 10px 13px 11px; font: 400 15px/1.4 var(--f-text); color: var(--ink); }
.bubble small { display: block; font: 500 12.5px/1.35 var(--f-ui); color: var(--ink-3); margin-top: 3px; }
.greet { display: flex; align-items: flex-end; gap: 4px; }
.greet .mascot { width: 70px; height: auto; flex: none; }
.greet .bubble { max-width: 220px; margin-bottom: 38px; }
.greet .bubble::before { content: ""; position: absolute; left: -7px; bottom: 12px; border: 7px solid transparent; border-left: 0; border-right-color: var(--sunk); }
.greet.sm .mascot { width: 58px; }
.greet.sm .bubble { margin-bottom: 30px; max-width: 420px; }
/* The streak leaf turns like a Québec autumn the longer the streak runs. */
.streak { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px; border-radius: 999px; font: 800 12.5px/1 var(--f-ui); color: var(--ink); white-space: nowrap; justify-self: start; }
.streak svg { width: 15px; height: 16px; }
.streak.t1 { background: color-mix(in srgb, var(--leaf-1) 16%, transparent); } .streak.t1 svg, .leaf-ico.t1 { fill: var(--leaf-1); }
.streak.t2 { background: color-mix(in srgb, var(--leaf-2) 16%, transparent); } .streak.t2 svg, .leaf-ico.t2 { fill: var(--leaf-2); }
.streak.t3 { background: color-mix(in srgb, var(--leaf-3) 16%, transparent); } .streak.t3 svg, .leaf-ico.t3 { fill: var(--leaf-3); }
.streak.t4 { background: color-mix(in srgb, var(--leaf-4) 16%, transparent); } .streak.t4 svg, .leaf-ico.t4 { fill: var(--leaf-4); }
.leaf-ico.t0 { fill: var(--ink-3); }

/* Stamps to collect: earned ones sit a little crooked; the ones still to earn wait in grey. */
.stamps { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 18px 10px; }

.stamp .st-i { fill: none; stroke: currentColor; stroke-width: 1.2; }
.stamp .st-t { fill: currentColor; font-family: var(--f-ui); font-weight: 800; font-size: 8.3px; }
.stamp .st-n { fill: var(--paper); font-family: var(--f-text); font-weight: 600; font-size: 13px; }

/* "Journée validée": a stamp lands on the day's header once every block is ticked. */
.tb-stamp { width: 150px; height: auto; color: var(--red); transform: rotate(-11deg); overflow: visible; flex: none; }
.tb-stamp text { fill: currentColor; font-family: var(--f-ui); font-weight: 800; font-size: 15.5px; letter-spacing: .05em; }
.tb-stamp .tb-o { fill: none; stroke: currentColor; stroke-width: 3; }
.tb-stamp .tb-i { fill: none; stroke: currentColor; stroke-width: 1.2; }
.tb-stamp .tb-leaf { fill: currentColor; }
/* The boarding pass: the five phases as one flight from B1 to NCLC 7. */
.pass { display: grid; grid-template-columns: minmax(0, 1fr) 150px; border: 1px solid var(--rule-2); border-radius: var(--r-card); background: var(--surface); overflow: hidden; max-width: 760px; box-shadow: var(--shadow); }

.pass-stub::before, .pass-stub::after { content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule-2); }
.pass-stub::before { top: -11px; } .pass-stub::after { bottom: -11px; }
.seat small { display: block; font: 700 10.5px/1.2 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

@media (max-width: 620px) {

  .pass-stub::before, .pass-stub::after { top: -11px; bottom: auto; }
  .pass-stub::before { left: -11px; } .pass-stub::after { left: auto; right: -11px; }

}
.mini-pass { border: 1px solid var(--rule); border-radius: 14px; padding: 10px 11px 8px; display: grid; gap: 3px; background: var(--surface); text-decoration: none; color: var(--ink-3); box-shadow: var(--shadow-sm); transition: border-color var(--dur-fast), transform var(--dur-fast) var(--ease); }
.mini-pass:hover { border-color: var(--rule-2); transform: translateY(-1px); }
.mini-pass .top { display: flex; justify-content: space-between; gap: 6px; font: 800 9.5px/1.2 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.mini-pass b { color: var(--ink); font-size: 13px; line-height: 1.25; }
.mini-pass svg { width: 100%; height: auto; display: block; }
/* L'expression du jour: a new saying every morning on a scrap of notebook paper. */
.note-card { --mx: 48px; position: relative; transform: rotate(-1.2deg); padding: 30px 18px 16px 64px; border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); display: grid; gap: 0; margin: 10px 0 0; transition: transform var(--dur) var(--ease); }

.note-card .eyebrow { line-height: 32px; }

.note-card .xp-deck { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; line-height: 32px; text-decoration: none; }
.note-card .xp-deck .ico { width: 16px; height: 16px; }
.note-card .xp-deck::after { content: "→"; transition: transform var(--dur) var(--ease); }

@media (prefers-reduced-motion: reduce) { .note-card .xp-deck:hover::after { transform: none; } }

/* Tabs and segmented buttons: a tray with the current one raised out of it. */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--sunk); overflow-x: auto; width: fit-content; max-width: 100%; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a, .tabs button { padding: 8px 14px; border: 0; background: none; border-radius: 10px; color: var(--ink-2); font-weight: 700; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background-color var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast); }

.tabs a small, .tabs button small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.tabs [aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow-sm); }
@media (max-width: 560px) { .tabs a small, .tabs button small { display: none; } }

.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--sunk); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 0; background: transparent; padding: 6px 11px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--ink-2); cursor: pointer; transition: background-color var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast); }
.seg button + button { border-left: 0; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

.notice { padding: 13px 16px; border-radius: 14px; background: var(--sunk); color: var(--ink-2); font-size: 14px; }
.notice.warn { background: var(--amber-soft); color: var(--ink); }
.empty { padding: 22px; border: 1.5px dashed var(--rule-2); border-radius: var(--r-card); color: var(--ink-3); text-align: center; }
/* Rémy waits in an empty box, centred, with his line read left to right. */
.empty .greet { justify-content: center; text-align: left; color: var(--ink); }

.bar { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: inherit; }

/* red-pen corrections */
.pen-wrong { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: var(--ink-2); font-family: var(--f-text); }
.pen-right { font-family: var(--f-hand); font-weight: 400; color: var(--red); font-size: 14.5px; line-height: 1.9; }
.pen-ok { font-family: var(--f-hand); color: var(--green); font-size: 14.5px; }

/* Seyès ruling (French grands carreaux) */
.seyes {
  background-color: var(--surface);
  background-image:
    linear-gradient(90deg, transparent var(--mx, 55px), var(--margin) var(--mx, 55px), var(--margin) calc(var(--mx, 55px) + 1.5px), transparent calc(var(--mx, 55px) + 1.5px)),
    linear-gradient(to bottom, var(--seyes-2) 1px, transparent 1px),
    linear-gradient(to bottom, var(--seyes) 1px, transparent 1px),
    linear-gradient(to right, var(--seyes) 1px, transparent 1px);
  background-size: 100% 32px, 100% 32px, 100% 8px, 32px 32px;
  background-position: 0 0, 0 0, 0 0, calc(var(--mx, 55px) + 1px) 0;
}

/* ---------- today ---------- */
/* The notebook header: the date and phase on the left; the day's ring (or its stamp, once the day is done) and
   Rémy with his line on the right. They wrap under the date when there isn't room. */
.cahier-head { --mx: 52px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px; padding: 12px 22px 14px 80px; border-radius: var(--r-lg); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.head-main { display: grid; min-width: 0; }
.head-side { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 18px; }
.head-side > .tb-stamp { align-self: center; margin: 4px 6px; }
.head-side .greet .bubble { max-width: 210px; }
@media (max-width: 640px) {
  .cahier-head { --mx: 40px; padding-left: 58px; padding-right: 16px; }
  .head-side .greet .mascot { width: 58px; }
  .head-side .greet .bubble { margin-bottom: 28px; }
  .head-side > .tb-stamp { width: 128px; }
}
.date-hand { font: 400 clamp(20px, 3.2vw, 27px)/64px var(--f-hand); color: var(--ink); text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 12px; }
.cahier-head .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; color: var(--ink-2); font-size: 14px; }
.cahier-head .meta b { color: var(--ink); }
/* The day's ring: blocks ticked out of the plan, with the minutes still to go. */

.day-ring .ring { position: relative; width: 76px; height: 76px; }
.day-ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.rg-track { fill: none; stroke: var(--sunk); stroke-width: 5; }
.rg-fill { fill: none; stroke: var(--green); stroke-width: 5; stroke-linecap: round; }
.rg-fill.empty { stroke: transparent; }
.rg-n { position: absolute; inset: 0; display: grid; place-items: center; font: 800 20px/1 var(--f-ui); font-variant-numeric: tabular-nums; color: var(--ink); }
.rg-n small { font-size: 14px; color: var(--ink-3); }
.day-ring > small { font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.daychips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.daychips::-webkit-scrollbar { display: none; }
.daychip { display: grid; justify-items: center; gap: 1px; min-width: 56px; padding: 8px 8px 7px; border-radius: 14px; border: 1.5px solid var(--rule); background: var(--surface); cursor: pointer; color: var(--ink-2); font-size: 12px; font-weight: 700; transition: transform var(--dur-fast) var(--ease), border-color var(--dur-fast), box-shadow var(--dur-fast), background-color var(--dur-fast); -webkit-tap-highlight-color: transparent; }
.daychip:hover { transform: translateY(-1px); border-color: var(--rule-2); box-shadow: var(--shadow-sm); }
.daychip:active { transform: translateY(1px); box-shadow: none; }
.daychip b { font-size: 17px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.daychip i { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 2px; }
.daychip i.part { background: var(--leaf-2); }
.daychip i.full { background: var(--green); }
.daychip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.daychip[aria-pressed="true"] b { color: var(--accent); }
.daychip.is-today b { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 3px; }
/* The day's blocks. The next one to do is open, with its details and a big Start; the others show their title and
   open with a tap; done ones shrink to a ticked line. */
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.block { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 11px 14px 11px 12px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.block:hover { border-color: var(--rule-2); }
.block.next { align-items: start; padding: 16px 16px 16px 14px; border-color: color-mix(in srgb, var(--accent) 38%, var(--rule)); box-shadow: var(--shadow); }
.block.next > .btn { align-self: center; }

.block .tick { padding-top: 0; }
.tick { position: relative; display: grid; place-items: center; width: 30px; height: 30px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.block .tick input, .tick input { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border-radius: 50%; border: 2px solid var(--rule-2); background: var(--surface); cursor: pointer; transition: background-color var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast) var(--ease); }
.tick:hover input { border-color: var(--green); transform: scale(1.06); }
.tick input:checked { background: var(--green); border-color: var(--green); }
.tick-mark { position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; fill: none; stroke: var(--on-green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; opacity: 0; }
.tick-mark path { stroke-dasharray: 18; }
.tick input:checked + .tick-mark { opacity: 1; }
.block-main { min-width: 0; }
.block-main > summary { list-style: none; cursor: pointer; border-radius: 10px; }
.block-main > summary::-webkit-details-marker { display: none; }
.block-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.block-top h3 { font: 700 16px/1.3 var(--f-ui); }
.block-top .min { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.block-top .chev { color: var(--ink-3); }
.block-main > summary:hover .chev { color: var(--ink); }

.block-more { display: grid; gap: 6px; padding-top: 8px; }

   a small meter toward the next level, and in red pen why the plan changed for you. */
.block-top .coach-l1 { flex-basis: 100%; margin: 0; font-size: 14px; font-weight: 600; color: var(--ink-2); max-width: 64ch; }

.coach-l2 { margin: 0; font-size: 13.5px; color: var(--ink-2); max-width: 64ch; }
.cchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.cchip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); font: 700 12px/1.45 var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }

.cmeter small { color: var(--ink-3); font-weight: 700; font-size: 12px; }

.adapt-ink { position: absolute; left: 0; right: 0; bottom: -3px; height: 2px; border-radius: 2px; background: var(--red); transform-origin: left; opacity: .85; }

/* Ce qui te freine: what's holding you back, with where the plan deals with it. */
.blk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.blk-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }

/* On a phone, Start stays beside the title, except on the next block, where the big button goes under its details. */

}
.side { display: grid; gap: 18px; }
.side .panel { padding: 18px; }
.hw { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }

.x { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 3px 6px; border-radius: 8px; transition: color var(--dur-fast), background-color var(--dur-fast); }
.x:hover { color: var(--red); background: var(--red-soft); }
.heat { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; }
.heat i { border-radius: 3px; background: var(--sunk); }

.heat i.l3 { background: var(--green); }

/* ---------- grammar ---------- */
/* The three ways to practise across topics, as tiles. */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

.tile-card { position: relative; display: grid; align-content: start; gap: 6px; padding: 18px 40px 16px 18px; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--ink); text-decoration: none; transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), border-color var(--dur-fast); -webkit-tap-highlight-color: transparent; }
.tile-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--rule-2); }

@media (prefers-reduced-motion: reduce) { .tile-card:hover, .tile-card:active { transform: none !important; } }
/* The topics, as one card of rows. */
.topics { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.topics li + li a { border-top: 1px solid var(--rule); }
.topics li a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 12px; gap: 4px 14px; align-items: center; padding: 13px 16px; text-decoration: none; color: var(--ink); transition: background-color var(--dur-fast); }
.topics li a::after { content: "›"; font-weight: 800; font-size: 18px; line-height: 1; color: var(--ink-3); transition: transform var(--dur) var(--ease), color var(--dur-fast); }
.topics li a:hover { background: var(--hover); }
.topics li a:hover::after { transform: translateX(3px); color: var(--accent); }
@media (max-width: 560px) { .topics li a { grid-template-columns: 26px minmax(0, 1fr) 12px; } .topics .meta { grid-column: 2; grid-row: 2; justify-content: flex-start; } }
/* A topic's notes: the rule, your mistakes and examples, each a fold. */
.notes { display: grid; gap: 6px; }
.topics .n { font: 800 15px/1 var(--f-ui); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.topics .t b { font-weight: 700; }
.topics .t small { display: block; color: var(--ink-3); font-size: 13px; }
.topics .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.set-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.set-row:last-child { border-bottom: 0; }
.lvl { display: inline-block; font: 800 11px/1 var(--f-ui); letter-spacing: .04em; padding: 4px 6px; border-radius: 6px; border: 1.5px solid var(--rule-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lvl.b2 { border-color: var(--ink); color: var(--ink); }
.mistakes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mistakes li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.examples { display: grid; gap: 10px; }

.examples div p + p { font-size: 13.5px; color: var(--ink-3); }
.drill { display: grid; gap: 16px; }
.drill-q { display: grid; gap: 16px; }
.drill-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.drill .src { font: italic 400 16px/1.45 var(--f-text); color: var(--ink-2); }
.drill .q { font: 400 21px/1.7 var(--f-text); }
.blank { font: 400 21px/1.3 var(--f-text); border: 0 !important; border-bottom: 2px solid var(--accent) !important; border-radius: 6px 6px 0 0 !important; background: var(--accent-soft) !important; padding: 2px 8px !important; min-width: 7ch; max-width: 100%; box-shadow: none !important; }
.blank:focus { outline: none !important; background: var(--accent-soft); }
.blank.ok { border-bottom-color: var(--green) !important; background: var(--green-soft) !important; }

.accents { display: flex; flex-wrap: wrap; gap: 5px; }

.accents button:hover { border-color: var(--ink-3); }
.accents button:active { transform: translateY(2px); box-shadow: none; }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.choices button { text-align: left; padding: 12px 14px; border: 1.5px solid var(--rule-2); border-radius: var(--r); background: var(--surface); font: 400 17px/1.3 var(--f-text); cursor: pointer; display: flex; gap: 10px; align-items: baseline; box-shadow: 0 2px 0 var(--rule-2); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), border-color var(--dur-fast), background-color var(--dur-fast); -webkit-tap-highlight-color: transparent; }
.choices button .kbd { flex: none; }

.choices button:active { transform: translateY(2px); box-shadow: none; }

/* Find the mistakes: words marked in red pen, then found (green), missed (red) and fine but marked (crossed) */
.pr-text { font: 400 18px/1.8 var(--f-text); }
.pr-text p { margin: 0 0 10px; }

.pr-w.pr-missed { background: var(--red-soft); text-decoration: underline var(--red); text-decoration-thickness: 2px; text-underline-offset: 4px; }

.pr-n { display: inline-block; min-width: 1.5em; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 800 11px/1.6 var(--f-ui); text-align: center; }
.pr-text sup.pr-n { font-size: 10px; line-height: 1.5; margin-right: 2px; vertical-align: super; }
.pr-fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pr-fixes li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pr-fixes .blank { font-size: 18px; }
.pr-fix { color: var(--green); font-weight: 700; }
.scorebig { font: 800 46px/1 var(--f-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.history { display: flex; flex-wrap: wrap; gap: 6px; }

/* Your mistakes: your own text on notebook paper with your mistakes back in it. Words you tap get the red pen; after
   Check the ones found are in blue ink and the missed ones underlined in red, each numbered. Then a card for each
   one, and the red pen rewrites the text as you fix it: your words crossed out, the correction written in. */
.mh-sujet { font-size: 13.5px; line-height: 1.5; color: var(--ink-2); max-width: 72ch; }
.mh-text { --mx: 40px; padding: 0 18px 0 58px; border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow-sm); font: 400 18px/32px var(--f-text); background-position: 0 0, 0 24px, 0 0, calc(var(--mx) + 1px) 0; }
.mh-text p { margin: 0 0 32px; }
.mh-text p:last-child { margin-bottom: 0; }
.mh-text .pr-w.mh-found { background: color-mix(in srgb, var(--accent) 13%, transparent); box-shadow: inset 0 -2px 0 var(--accent); color: var(--accent); }
.mh-text .pr-w.pr-missed { background: color-mix(in srgb, var(--red) 9%, transparent); }
.mh-text sup.pr-n { position: relative; top: -2px; }
.pr-n.ok { background: var(--green); color: var(--on-green); }
.pr-n.bad { background: var(--red); color: var(--paper); }
.mh-fixed del, .pd del { text-decoration: none; color: var(--ink-3); background: linear-gradient(var(--red), var(--red)) no-repeat 0 56% / 100% 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.mh-fixed ins { margin-left: .35em; }
.mh-progress { display: grid; gap: 6px; }

.mh-cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.mh-card { display: grid; gap: 12px; padding: 14px 16px 16px; border: 1px solid var(--rule); border-left: 4px solid var(--rule-2); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-sm); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.mh-card.cur { border-left-color: var(--accent); box-shadow: var(--shadow); }
.mh-card.ok { border-left-color: var(--green); }
.mh-card.bad { border-left-color: var(--red); }
.mh-card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.mh-was { font: italic 400 17px/1.45 var(--f-text); color: var(--ink-2); text-decoration: underline wavy var(--pen); text-decoration-thickness: 1.25px; text-underline-offset: 5px; }
.mh-q { flex-basis: 100%; font: 400 18px/1.6 var(--f-text); }
.mh-card .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mh-card .choices button.dim { opacity: .5; }
.mh-after { display: grid; gap: 4px; padding: 10px 14px; border-radius: 12px; background: var(--sunk); }
.mh-card.ok .mh-after { background: var(--green-soft); }
.mh-card.bad .mh-after { background: var(--red-soft); }
.mh-after .why { color: var(--ink-2); font-size: 14px; }
.pd { font: 400 18px/1.7 var(--f-text); }
.mh-intro { gap: 14px; }
.mh-next { --mx: 30px; position: relative; display: grid; gap: 6px; justify-items: start; width: 100%; text-align: left; padding: 22px 52px 16px 46px; border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); color: var(--ink); font: inherit; cursor: pointer; rotate: -.5deg; transition: rotate var(--dur) var(--ease), translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease); -webkit-tap-highlight-color: transparent; }
.mh-next:hover { rotate: 0deg; translate: 0 -2px; box-shadow: var(--shadow-lg); }
.mh-next:active { translate: 0 1px; box-shadow: var(--shadow-sm); }
.mh-next-tape { position: absolute; top: -10px; left: 30%; width: 96px; height: 22px; rotate: -3deg; background: var(--tape); }
.mh-next-title { font: 800 18px/1.3 var(--f-ui); }
.mh-next-sujet { font: italic 400 15px/1.5 var(--f-text); color: var(--ink-2); max-width: 64ch; }
.mh-next-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.mh-next-go { position: absolute; right: 18px; top: 50%; translate: 0 -50%; font: 800 22px/1 var(--f-ui); color: var(--accent); transition: translate var(--dur-fast) var(--ease); }
.mh-next:hover .mh-next-go { translate: 4px -50%; }
.mh-prep { display: grid; gap: 8px; padding: 12px 14px; border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--rule)); border-radius: 14px; background: var(--accent-soft); }
.mh-prep p { margin: 0; }
.pill.tip { background: var(--amber-soft); color: var(--amber); }

@media (max-width: 560px) {
  .mh-text { --mx: 20px; padding: 0 12px 0 32px; font-size: 17px; }
  .mh-next { --mx: 18px; padding: 22px 40px 14px 30px; }
  .mh-card { padding: 12px 12px 14px; }
  .mh-card .choices { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- vocab ---------- */
.flash { display: grid; gap: 18px; text-align: center; padding: 34px 24px 24px; }
.panel.flash { border-radius: var(--r-lg); }
.flash .prompt { font: 700 24px/1.3 var(--f-ui); }
.flash .answer { font: 400 30px/1.25 var(--f-text); color: var(--accent); }
.flash .ex { font: italic 400 16px/1.5 var(--f-text); color: var(--ink-2); max-width: 52ch; margin: 0 auto; }
/* The four grades after a recall (FSRS): each with its key and, where it sets the schedule, the gap it would give. */
.row > .grade4 { flex: 1 1 100%; }
.grade4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 540px; margin: 0 auto; }

@media (max-width: 560px) { .btn.grade .kbd { display: none; } }
/* The grading tones' switch, in a session's header. */
.v-sound .ico { width: 16px; height: 16px; }
.v-sound[aria-pressed="false"] { color: var(--ink-3); }
.ex-l { display: block; }

.flash .note { font: 400 15px/1.5 var(--f-ui); color: var(--ink-2); max-width: 52ch; margin: 0 auto; }
.flash .note.fr { font: 400 16px/1.5 var(--f-text); }
.flash .row { justify-content: center; }
.flash-back { display: grid; gap: 14px; }
.deck { width: 100%; border-collapse: collapse; font-size: 14px; }
.deck th, .deck td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.deck th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; }
.deck td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { overflow-x: auto; }
details.fold > summary { cursor: pointer; font-weight: 700; color: var(--accent); list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "+ "; }
details.fold[open] > summary::before { content: "– "; }
.cards-list { list-style: none; margin: 8px 0 0; padding: 0; columns: 2 260px; column-gap: 24px; font-size: 14px; }
.cards-list li { break-inside: avoid; border-bottom: 1px solid var(--rule); }
.peek > summary { list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 2px; cursor: pointer; border-radius: 6px; transition: background-color var(--dur-fast); }
.peek > summary::-webkit-details-marker { display: none; }
.peek > summary:hover { background: var(--hover); }
.peek-fr { font-family: var(--f-text); }
.peek[open] > summary .peek-fr { font-weight: 600; }
.peek-body { display: grid; gap: 8px; padding: 2px 2px 12px 12px; margin-left: 2px; border-left: 2px solid color-mix(in srgb, var(--red) 40%, transparent); animation: peek-in var(--dur) var(--ease); }
.peek-en { margin: 0; font-weight: 700; font-size: 14px; }
.ex-list { margin: 0; font: 400 15px/1.5 var(--f-text); color: var(--ink); }
@keyframes peek-in { from { opacity: 0; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .peek-body { animation: none; } }

/* ---------- writing ---------- */
.prompt-card { display: grid; gap: 10px; }
.prompt-card .fr { font-size: 19px; line-height: 1.45; }
.docs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 700px) { .docs { grid-template-columns: minmax(0, 1fr); } }
.doc { padding: 16px 18px; border: 1px solid var(--rule); border-radius: 14px; background: var(--hover); display: grid; gap: 8px; align-content: start; }
.doc p.fr { font-size: 16px; line-height: 1.55; }
.doc .who { font-size: 13px; color: var(--ink-3); font-style: italic; }
.editor { display: grid; gap: 0; padding: 0; overflow: hidden; }
.ed-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); }
textarea.seyes { border: 0; border-radius: 0; min-height: 416px; padding: 10px 20px 20px 72px; font: 400 17px/32px var(--f-text); color: var(--ink); resize: vertical; background-attachment: local; }
textarea.seyes:focus { outline: none; box-shadow: none; }
.meter { display: grid; gap: 5px; min-width: 220px; flex: 1; max-width: 360px; }
.meter .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter .lab b { color: var(--ink); font-size: 15px; }
.meter .track { position: relative; height: 8px; border-radius: 999px; background: var(--sunk); }
.meter .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--green) 22%, transparent); border-radius: 999px; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--ink-3); transition: width .15s; }
.meter.under .fill { background: var(--amber); }
.meter.in .fill { background: var(--green); }
.meter.over .fill { background: var(--red); }
.meter.over .lab b { color: var(--red); }
.timer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.timer .clock { font: 800 22px/1 var(--f-ui); font-variant-numeric: tabular-nums; min-width: 4.2ch; }
.timer .clock.over { color: var(--red); }
.timer.done .clock { color: var(--green); }
.timer.done .clock.over { color: var(--red); }
.paras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; padding: 12px 16px 14px; border-top: 1px solid var(--rule); background: var(--surface); }
@media (max-width: 700px) { .paras { grid-template-columns: minmax(0, 1fr); } }
.paras .meter { min-width: 0; max-width: none; }
.fb { display: grid; gap: 18px; }
.fb-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.level { font: 800 36px/1 var(--f-ui); letter-spacing: -.02em; white-space: nowrap; }
.level small { font-size: 18px; color: var(--ink-3); font-weight: 600; }
table.crit { width: 100%; border-collapse: collapse; font-size: 14px; }
table.crit th, table.crit td { text-align: left; vertical-align: top; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule); }
table.crit th { font-weight: 700; white-space: nowrap; width: 1%; }
table.crit td:nth-child(2) { width: 1%; }
table.crit td:last-child { color: var(--ink-2); }
label.field.inline { grid-auto-flow: column; align-items: center; gap: 6px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.errs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.errs li { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.errs li .fix { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.errs li .why { font-size: 13.5px; color: var(--ink-2); }
.corrected { font: 400 17px/32px var(--f-text); padding: 10px 20px 14px 72px; border-radius: 14px; border: 1px solid var(--rule); white-space: pre-wrap; }
.upgrades { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.upgrades li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-family: var(--f-text); }
.upgrades li .arrow { color: var(--ink-3); font-family: var(--f-ui); }

/* ---------- comprehension ---------- */
.sheet { padding: 22px 24px; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); display: grid; gap: 12px; box-shadow: var(--shadow-sm); }
.sheet h3 { font: 600 19px/1.3 var(--f-text); }
.sheet .fr { font-size: 16.5px; line-height: 1.65; white-space: pre-line; }
.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; counter-reset: q; }
.qs > li { display: grid; gap: 8px; counter-increment: q; }
.qs > li > p.q { font-weight: 700; }
.qs > li > p.q::before { content: counter(q) ". "; color: var(--ink-3); }
/* reading sets: a document above each question */
.qs.ce-items { gap: 32px; }
.qs.ce-items > li { gap: 10px; }
/* A set or exam checked with its answers hidden, so trying it again isn't spoiled: the score, Rémy with his eyes
   shut, and the way back to the answers. */
.ans-hid .h3 { display: flex; align-items: center; gap: 8px; }
.ans-hid .h3 .ico { width: 22px; height: 22px; color: var(--ink); }
.ans-hid .h3 small { font-weight: 600; }
.ans-hid > .row > p { flex: 1 1 260px; margin: 0; }
.opts { display: grid; gap: 7px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 13px; border: 1.5px solid var(--rule); border-radius: var(--r); cursor: pointer; font-family: var(--f-text); font-size: 16px; background: var(--surface); transition: border-color var(--dur-fast), background-color var(--dur-fast), transform var(--dur-fast) var(--ease); -webkit-tap-highlight-color: transparent; }
.opt:hover { border-color: var(--rule-2); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.ok { border-color: var(--green); background: var(--green-soft); }
.opt.bad { border-color: var(--red); background: var(--red-soft); }
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.player .btn { gap: 7px; }
.player .btn.primary { min-width: 7.5em; }
.player .btn svg { width: 15px; height: 15px; flex: none; }
.player .seek { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
.player .seek input { flex: 1; min-width: 0; accent-color: var(--accent); }
.player .seek .num { white-space: nowrap; color: var(--ink-3); }
/* the listening controls stay on screen while you scroll down to the questions (below the phone's top bar) */
.player-dock { position: sticky; top: 12px; z-index: 4; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
@media (max-width: 880px) { .player-dock { top: calc(env(safe-area-inset-top, 0px) + var(--rail-h, 0px) + 6px); } }
.transcript { display: grid; gap: 6px; }
.transcript p { font-family: var(--f-text); font-size: 16px; }
.transcript p b { font-family: var(--f-ui); font-size: 12px; color: var(--ink-3); margin-right: 6px; }
/* history tree: topic → set → attempt */
.tree { display: grid; gap: 8px; }
.h-node { border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); }
.h-node > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 14px; cursor: pointer; list-style: none; border-radius: 14px; transition: background-color var(--dur-fast); }
.h-node > summary::-webkit-details-marker { display: none; }
.h-node > summary::before { content: "▸"; color: var(--ink-3); width: 12px; }
.h-node[open] > summary::before { content: "▾"; }
.h-node > summary:hover { background: var(--hover); }
.h-kids { display: grid; gap: 6px; padding: 0 14px 12px 36px; }
.h-kids .h-node { background: var(--paper); }
.h-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; border: 1.5px dashed var(--rule-2); border-radius: 14px; }
.h-att { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.h-kids > .h-att:first-child { border-top: 0; }
.h-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.h-meta { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.lv { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); font: 800 11.5px/1.35 var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lv.done { background: var(--green-soft); color: var(--green); }
.miss { font-size: 12.5px; font-weight: 700; color: var(--red); white-space: nowrap; }
.ok-t { font-weight: 800; color: var(--green); }
/* practice exam: the 1–39 navigator */
.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 5px; }
.qnav button { height: 34px; border: 1.5px solid var(--rule-2); border-radius: 9px; background: var(--surface); color: var(--ink-2); font: 800 13px/1 var(--f-ui); font-variant-numeric: tabular-nums; cursor: pointer; transition: background-color var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast) var(--ease); }
.qnav button:hover { border-color: var(--ink-3); }
.qnav button:active { transform: scale(.94); }
.qnav button.done { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.qnav button[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
/* the CO practice exam: the phase strip, the drawing on notebook paper, the A–D buttons and the progress strip */
.cox-phase { gap: 12px; min-height: 30px; }
.cox-bar { flex: 1; max-width: 360px; }
.cox-bar > i { background: var(--accent); transition: width .2s linear; }
.pic-card { --mx: 40px; margin: 0; padding: 14px 18px 10px 52px; border: 1px solid var(--rule); border-radius: 14px; justify-self: start; width: min(100%, 480px); }
svg.scene { display: block; width: 100%; height: auto; color: var(--accent); }
.letters { display: flex; flex-wrap: wrap; gap: 10px; }
.opt.letter { width: 64px; height: 56px; padding: 0; justify-content: center; align-items: center; position: relative; font: 800 22px/1 var(--f-ui); border-radius: 14px; box-shadow: 0 2px 0 var(--rule-2); }
.opt.letter:active { transform: translateY(2px); box-shadow: none; }
.opt.letter input { position: absolute; opacity: 0; pointer-events: none; }
.opt.letter:has(input:checked), .opts .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt.letter:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.cox-strip span { display: grid; place-items: center; height: 28px; border: 1.5px solid var(--rule-2); border-radius: 8px; color: var(--ink-3); font: 800 12.5px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.cox-strip span.done { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.cox-strip span[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 1px; color: var(--ink); }
audio.cox-audio { width: 100%; max-width: 420px; height: 36px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.links li { display: grid; gap: 2px; }
.links a { font-weight: 700; }

/* ---------- progress ---------- */
.criteria { list-style: none; margin: 0; padding: 0; display: grid; }
.criteria li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.criteria .mark { font: 800 16px/1.2 var(--f-ui); }
.criteria .mark.ok { color: var(--green); }
.criteria .mark.no { color: var(--ink-3); }
.criteria small { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.bars { display: grid; gap: 8px; }
.bars .b { display: grid; grid-template-columns: minmax(120px, 210px) minmax(0, 1fr) 30px; gap: 12px; align-items: center; font-size: 14px; }
.bars .b .track { height: 10px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.bars .b .track i { display: block; height: 100%; background: var(--red); border-radius: 999px; }
.bars .b .c { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
table.nclc { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.nclc th, table.nclc td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
table.nclc th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; }
table.nclc tr.target td { background: var(--green-soft); font-weight: 700; }
.tag7 { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.tag7.ok { background: var(--green-soft); color: var(--green); }
.tag7.no { background: var(--red-soft); color: var(--red); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { padding: 15px 16px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); }
.stat b { display: block; font: 800 28px/1.1 var(--f-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-3); }
.exam { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.exam div { padding: 15px 16px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); display: grid; gap: 4px; }
.exam .sk { justify-self: start; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); }
.toast-ghost { pointer-events: none; }
.thinking::after { content: "…"; animation: dots 1.2s steps(3, end) infinite; display: inline-block; width: 1em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1em; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- saving a word or phrase from any page ---------- */
/* The button under a selection, the panel that saves it, and the words already saved, marked like a highlighter pen. */
.grab-btn { position: absolute; z-index: 16; display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px 8px 11px; border: 1.5px solid var(--rule-2); border-radius: 999px; background: var(--surface); color: var(--ink); font: 700 13px/1 var(--f-ui); box-shadow: var(--shadow-lg); cursor: pointer; white-space: nowrap; }
.grab-btn:hover { border-color: var(--ink-3); }
.grab-btn .ico { width: 17px; height: 17px; }
/* The next bar: what's next in today's plan, once a block is ticked, wherever you are. */
.nextup { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 14; width: min(620px, calc(100vw - 32px)); background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 10px 10px 10px 16px; }
.nu-in { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.nu-was { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--green); min-width: 0; }
.nu-tick { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; animation: nu-draw .45s .12s var(--ease) backwards; }
@keyframes nu-draw { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
.nu-next { display: flex; align-items: baseline; gap: 8px; flex: 1 1 200px; min-width: 0; }
.nu-next small { flex: none; font-weight: 800; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.nu-next b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.nu-min { flex: none; color: var(--ink-3); font-weight: 700; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nu-hand { font: 600 18px/1.3 var(--f-hand); color: var(--red); }
.nu-x { padding: 4px 10px; }
/* Beside the sidebar, it's centred on the page's column. */
@media (min-width: 881px) { .nextup { left: calc(50% + 122px); width: min(620px, calc(100vw - 276px)); } }
body:has(#nextup:not([hidden])) .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
body:has(#nextup:not([hidden])) #view { padding-bottom: 96px; }
@media (prefers-reduced-motion: reduce) { .nu-tick { animation: none; } }
.grab { position: fixed; right: 20px; bottom: 20px; z-index: 15; width: min(380px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow: auto; display: grid; gap: 12px; padding: 18px 20px; box-shadow: var(--shadow-lg); }
.grab-btn[hidden], .grab[hidden] { display: none; }
.grab-dup { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--sunk); }
.grab-dup .fr { font-size: 17px; }
@media (max-width: 640px) {
  .grab { left: 0; right: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: 20px 20px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
@media (pointer: coarse) { .grab .kbd { display: none; } }
::highlight(saved) { background-color: #FFEC99; }
:root.dark ::highlight(saved) { background-color: #4D3C0F; }
.wait-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.wait-list > li { padding-top: 14px; border-top: 1px solid var(--rule); }
.wait-list > li:first-child { padding-top: 0; border-top: 0; }
.wait-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .wait-fields { grid-template-columns: minmax(0, 1fr); } }

/* ---------- charts (charts.js) ---------- */
/* Thin marks with 2 px gaps, hairline grids in the paper's tone, numbers in the text colours. */
.c-chart { margin: 0; display: grid; gap: 10px; min-width: 0; }
.c-plot { position: relative; margin: 6px 10px 0 36px; }
.c-plot.bare { margin-left: 0; margin-right: 0; }
.c-plot::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; border-top: 1.5px solid var(--rule-2); pointer-events: none; }
.c-grid, .c-ref { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
.c-grid { border-top: 1px solid var(--c-grid); }
.c-grid b, .c-ref b, .c-band b { position: absolute; font: 700 10.5px/1 var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-grid b { right: calc(100% + 7px); transform: translateY(-50%); color: var(--ink-3); }
.c-ref { z-index: 1; border-top: 1.5px dashed var(--ink-3); }
.c-ref b { right: 0; bottom: 4px; padding: 2px 6px; border-radius: 6px; background: var(--surface); color: var(--ink-2); }
.c-band { position: absolute; left: 0; right: 0; background: color-mix(in srgb, var(--ink) 4%, transparent); pointer-events: none; }
.c-band.target { background: var(--green-soft); }
.c-band b { left: calc(100% + 8px); top: 50%; transform: translateY(-50%); letter-spacing: .02em; color: var(--ink-3); }
.has-bands .c-plot, .has-bands .c-xs { margin-right: 56px; }
.c-band.target b { color: var(--green); }
.c-xs { position: relative; height: 16px; margin: 0 10px 0 36px; font: 700 11px/1 var(--f-ui); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.c-xs.bare { margin-left: 0; margin-right: 0; }
.c-xs span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
.c-xs span.start { transform: none; }
.c-xs span.end { transform: translateX(-100%); }
/* Columns: one per day, the skills stacked bottom to top, today shaded. */
.c-colrow { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; }
.c-colw { position: relative; display: flex; align-items: flex-end; justify-content: center; border-radius: 7px 7px 0 0; transition: background-color var(--dur-fast); }
.c-colw.today { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.c-colw.c-on { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.c-colw.rest::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--rule-2); }
.c-col { position: relative; z-index: 1; width: min(100%, 26px); display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 6px 6px 2px 2px; overflow: hidden; transform-origin: 50% 100%; }
.c-col > i { display: block; min-height: 2px; }
/* Horizontal bars, with the label first and the number last. */
.c-hbars { gap: 2px; }
.c-hrow { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 3rem; gap: 14px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: 10px; color: inherit; text-decoration: none; transition: background-color var(--dur-fast); }
a.c-hrow:hover, .c-hrow.c-on { background: var(--hover); }
.c-hl { min-width: 0; }
.c-hl b { display: block; font: 700 13.5px/1.3 var(--f-ui); }
.c-hl small { display: block; font-size: 12px; line-height: 1.3; color: var(--ink-3); }
.c-ht { height: 10px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.c-ht > i { display: block; height: 100%; border-radius: inherit; transform-origin: 0 50%; }
.c-hv { font: 800 13px/1 var(--f-ui); font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
@container (max-width: 520px) { .c-hrow { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; } .c-ht { grid-column: 1 / -1; grid-row: 2; } }
/* A whole split into its parts, with the numbers in the legend under it. */
.c-bar { display: flex; gap: 2px; height: 22px; border-radius: 999px; overflow: hidden; background: var(--sunk); }
.c-bar > i { display: block; min-width: 3px; transition: filter var(--dur-fast); }
.c-bar > i.c-on { filter: brightness(1.12) saturate(1.1); }
.c-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.c-legend li { display: inline-flex; align-items: center; gap: 6px; }
.c-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.c-legend-v { display: grid; gap: 0; }
.c-legend-v li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 2.8rem; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.c-legend-v li:last-child { border-bottom: 0; }
.c-legend-v b { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-legend-v small { font-size: 12px; text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* Dots and lines: 2 px lines, dots ringed in the card's colour, a hollow dot for another try. */
.c-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.c-line { fill: none; stroke-width: 2.25; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.c-area { opacity: .1; }
.c-dot { position: absolute; z-index: 2; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--surface); translate: -50% 50%; transition: scale var(--dur-fast) var(--ease); }
.c-dot::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; }

.c-dot.c-on { scale: 1.45; }
.c-end { position: absolute; z-index: 3; translate: -50% -14px; padding: 2px 7px; border-radius: 7px; background: var(--ink); color: var(--paper); font: 800 11.5px/1.35 var(--f-ui); white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
.c-end.r { translate: calc(-100% + 8px) -16px; }
/* A ring with its number in the middle, and a tick at the target. */
.c-ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.c-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; rotate: -90deg; overflow: visible; }
.c-rtrack { fill: none; stroke: var(--sunk); }
.c-rfill { fill: none; stroke-linecap: round; }
.c-rtick { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.c-ring b { position: relative; font: 800 12.5px/1 var(--f-ui); font-variant-numeric: tabular-nums; color: var(--ink); }
.c-spark { display: block; overflow: visible; }
.c-sline { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.c-sarea { opacity: .13; }
.c-sdot { stroke: var(--surface); stroke-width: 2; }
/* A strip of days, like the heatmap: green for what was done, the red pen round today. */
.c-cells { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; height: 20px; }
.c-cells > i { border-radius: 3px; background: var(--sunk); }
.c-cells > i.l1 { background: color-mix(in srgb, var(--green) 32%, var(--sunk)); }
.c-cells > i.l2 { background: color-mix(in srgb, var(--green) 64%, var(--sunk)); }
.c-cells > i.l3 { background: var(--green); }
.c-cells > i.rest.l0 { background: transparent; box-shadow: inset 0 0 0 1px var(--rule-2); }
.c-cells > i.today { outline: 1.5px solid var(--red); outline-offset: 1px; }
.c-cells > i.c-on { outline: 2px solid var(--ink); outline-offset: 1px; }
/* Where a score sits among the NCLC bands: the target band in green, earlier scores hollow. */
.c-btrack { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; padding-top: 2px; }
.c-btrack > i { display: grid; gap: 5px; font-style: normal; }
.c-btrack > i::before { content: ""; height: 12px; background: var(--sunk); }
.c-btrack > i:first-child::before { border-radius: 999px 0 0 999px; }
.c-btrack > i:last-child::before { border-radius: 0 999px 999px 0; }
.c-btrack > i.target::before { background: color-mix(in srgb, var(--green) 32%, var(--surface)); }
.c-btrack > i b { font: 700 10.5px/1 var(--f-ui); text-align: center; color: var(--ink-3); }
.c-btrack > i.target b { font-weight: 800; color: var(--green); }
.c-mark, .c-ghost { position: absolute; top: 8px; translate: -50% -50%; border-radius: 50%; transition: scale var(--dur-fast) var(--ease); }
.c-mark::before, .c-ghost::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; }
.c-mark { z-index: 2; width: 20px; height: 20px; background: var(--accent); box-shadow: 0 0 0 3px var(--surface), 0 3px 10px -2px rgb(var(--shade) / .45); }
.c-mark.ok { background: var(--green); }
.c-ghost { z-index: 1; width: 10px; height: 10px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink-3); }
.c-mark.c-on, .c-ghost.c-on { scale: 1.25; }
/* The tooltip, and the numbers under each chart. */
.c-tip { position: fixed; left: 0; top: 0; z-index: 30; display: grid; gap: 2px; max-width: 280px; padding: 8px 11px; border-radius: 11px; background: var(--ink); color: var(--paper); font: 500 12.5px/1.35 var(--f-ui); box-shadow: var(--shadow-lg); pointer-events: none; }
.c-tip[hidden] { display: none; }
.c-tip b { font-weight: 800; }
.c-tip span { opacity: .82; }
table.c-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.c-table th, .c-table td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.c-table th { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; white-space: nowrap; }
.c-table td:first-child { white-space: nowrap; color: var(--ink-2); }

/* ---------- the dashboard (Progrès → Vue d'ensemble) ---------- */
.wrap.dash { max-width: 1180px; gap: 34px; }
.dash > .sec, .btile, #sec-pass { scroll-margin-top: 20px; }
@media (max-width: 880px) { .dash > .sec, .btile, #sec-pass { scroll-margin-top: calc(var(--rail-h, 0px) + 14px); } }
/* A section bar: sticks under the top as you scroll, with a pill on the section you're reading (a sheet's
   contents on the Fiches). */
.dash-nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 4; justify-self: start; display: flex; gap: 2px; max-width: 100%; padding: 5px; margin-bottom: -12px; border-radius: 999px; border: 1px solid var(--rule); background: color-mix(in srgb, var(--surface) 84%, transparent); -webkit-backdrop-filter: blur(12px) saturate(1.3); backdrop-filter: blur(12px) saturate(1.3); box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }
.dash-nav::-webkit-scrollbar { display: none; }
