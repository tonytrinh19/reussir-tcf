.dash-nav button { position: relative; z-index: 1; flex: none; border: 0; background: none; padding: 7px 13px; border-radius: 999px; font: 700 13px/1 var(--f-ui); color: var(--ink-2); cursor: pointer; transition: color .25s var(--ease); }
.dash-nav button:hover { color: var(--ink); }
.dash-nav button[aria-current="true"] { color: var(--accent-ink); }
.dash-pill { position: absolute; z-index: 0; left: 0; top: 0; border-radius: 999px; background: var(--accent); box-shadow: 0 3px 10px -3px color-mix(in srgb, var(--accent) 70%, transparent); pointer-events: none; transition: transform .38s var(--ease), width .38s var(--ease), opacity .2s; }
/* The headline numbers. */
#sec-kpis { container-type: inline-size; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; perspective: 1100px; }
@container (max-width: 1040px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } .kpi { grid-column: span 2; } .kpi:nth-child(-n + 2) { grid-column: span 3; } }
@container (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .kpi, .kpi:nth-child(-n + 2) { grid-column: span 1; } .kpi:first-child { grid-column: span 2; } }
.kpi { --kc: var(--accent); position: relative; isolation: isolate; display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 15px 16px 13px; border-radius: var(--r-card); border: 1px solid var(--rule); background: linear-gradient(165deg, color-mix(in srgb, var(--kc) 11%, var(--surface)) 0%, var(--surface) 60%); box-shadow: var(--shadow); }
.k-days { --kc: var(--leaf-1); } .k-acc { --kc: var(--c-gra); } .k-cards { --kc: var(--c-voc); } .k-rate { --kc: var(--red); }
.k-label { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.k-label > span:last-child { display: grid; gap: 1px; min-width: 0; font: 800 12px/1.2 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.k-label small { font: 600 11.5px/1.25 var(--f-ui); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.k-ico { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 11px; background: color-mix(in srgb, var(--kc) 16%, var(--surface)); }
.k-ico .ico { width: 19px; height: 19px; color: var(--ink); --pen: var(--red); }
.k-value { font: 800 30px/1.1 var(--f-ui); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
.k-value small { font-size: 16px; letter-spacing: 0; color: var(--ink-3); }
.k-sub { font-size: 12.5px; line-height: 1.4; color: var(--ink-3); }
.k-delta { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; padding: 3px 9px 3px 7px; border-radius: 999px; font: 800 11.5px/1.3 var(--f-ui); }
.k-delta > span { font-size: 9px; }
.k-delta.good { background: var(--green-soft); color: var(--green); }
.k-delta.bad { background: var(--red-soft); color: var(--red); }
.k-delta.flat { background: var(--sunk); color: var(--ink-2); }
.k-viz { margin-top: auto; padding-top: 10px; min-height: 44px; display: flex; align-items: flex-end; }
.k-viz > .c-chart { width: 100%; }
/* Cards on a 12-column grid that folds to one column as it narrows. */
.dash-grid { container-type: inline-size; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.dash-card { container-type: inline-size; position: relative; isolation: isolate; display: grid; align-content: start; gap: 14px; min-width: 0; padding: 18px 20px 20px; border-radius: var(--r-card); border: 1px solid var(--rule); background: var(--surface); box-shadow: var(--shadow); }
.dash-grid > .dash-card { grid-column: span 12; }
.dash-grid > .span-8 { grid-column: span 8; } .dash-grid > .span-7 { grid-column: span 7; } .dash-grid > .span-6 { grid-column: span 6; } .dash-grid > .span-5 { grid-column: span 5; } .dash-grid > .span-4 { grid-column: span 4; }
@container (max-width: 900px) { .dash-grid > .span-8, .dash-grid > .span-7, .dash-grid > .span-5, .dash-grid > .span-4 { grid-column: span 12; } }
@container (max-width: 640px) { .dash-grid > .span-6 { grid-column: span 12; } }
.dash-ch { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 14px; }
.dash-ch .h3 { display: flex; align-items: center; gap: 7px; }
.dash-ch .h3 > .ico { width: 18px; height: 18px; }
.dash-hint { padding: 10px 0 2px; }
/* NCLC 7, skill by skill. */
.ready { gap: 0; padding-block: 6px 16px; }
.r-row { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) minmax(0, 14rem) 8rem; gap: 10px 22px; align-items: center; padding: 15px 0 13px; border-bottom: 1px solid var(--rule); }
.r-skill { display: flex; align-items: center; gap: 10px; min-width: 0; }
.r-skill b { font: 700 14px/1.25 var(--f-ui); }
.r-val { display: grid; gap: 2px; min-width: 0; }
.r-val b { font: 800 14.5px/1.25 var(--f-ui); font-variant-numeric: tabular-nums; }
.r-val small { font-size: 12px; line-height: 1.35; color: var(--ink-3); }
.r-gap { justify-self: end; padding: 4px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); font: 800 12px/1.2 var(--f-ui); white-space: nowrap; }
.r-gap.ok { background: var(--green-soft); color: var(--green); }
.r-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding-top: 12px; }
.r-key > span { display: inline-block; flex: none; }
.r-key-t { width: 22px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--green) 32%, var(--surface)); }
.r-key-d { width: 12px; height: 12px; margin-left: 10px; border-radius: 50%; background: var(--accent); }
.r-key-g { width: 10px; height: 10px; margin-left: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink-3); }
@container (max-width: 820px) { .r-row { grid-template-columns: minmax(0, 1fr) auto; } .r-row .c-bullet { grid-column: 1 / -1; grid-row: 2; } .r-val { grid-column: 1 / -1; } .r-gap { grid-column: 2; grid-row: 1; } }
/* The phase tile: the criteria ring under the pass, and the criteria. */
.crit-top { display: flex; align-items: center; gap: 14px; }
.crit-card .criteria li:last-child { border-bottom: 0; }
/* Facts, the heatmap, topic tiles, the cards that slip, the practice exams. */
.since-heat { overflow-x: auto; }
.facts { margin: 0; display: grid; }
.facts > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.facts > div:last-child { border-bottom: 0; }
.facts dt { font-size: 13.5px; color: var(--ink-2); }
.facts dd { margin: 0; font: 800 14px/1.2 var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 215px), 1fr)); gap: 10px; perspective: 1000px; }
.t-tile { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 9px 12px 9px 9px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); text-decoration: none; }
.t-tile:hover { border-color: var(--rule-2); translate: 0 -2px; box-shadow: var(--shadow); }
.t-tile.ok { border-color: color-mix(in srgb, var(--green) 28%, var(--rule)); background: color-mix(in srgb, var(--green) 7%, var(--surface)); }
.t-tile.off .t-txt b { font-weight: 600; color: var(--ink-2); }
.t-txt { display: grid; gap: 1px; min-width: 0; }
.t-txt b { font: 700 13.5px/1.25 var(--f-ui); }
.t-txt small { font-size: 11.5px; line-height: 1.3; color: var(--ink-3); }
.hard { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.hard li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 3px 10px; padding: 11px 13px; border-radius: 12px; background: var(--sunk); }
.hard .fr { font-size: 16px; line-height: 1.3; }
.hard small { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-3); }
.exams-l { list-style: none; margin: 0; padding: 0; display: grid; }
.exams-l li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.exams-l li:last-child { border-bottom: 0; }
.exams-l b { font: 800 18px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
/* ---------- the bento: the overview as tiles ---------- */
/* Bands of tiles whose spans add up to 12: a band is a row that wraps on narrow screens, its tiles growing to fill
   the line, so there are no holes. An open tile goes first in its band at full width, with its face kept at the
   width it had (and sticky while you read the details beside it); the band's other tiles wrap below it. */
.bento { display: grid; gap: 16px; }
.band { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
.btile { --span: 6; flex: var(--span) 1 calc(var(--span) * 100% / 12 - 16px); min-width: min(100%, 268px); position: relative; isolation: isolate; container-type: inline-size; display: grid; grid-template-rows: auto 1fr; border-radius: var(--r-card); border: 1px solid var(--rule); background: var(--surface); box-shadow: var(--shadow); }
.btile.open { order: -1; flex-basis: 100%; border-color: var(--rule-2); box-shadow: var(--shadow-lg); }
.bt-h { display: flex; align-items: center; gap: 11px; width: 100%; min-width: 0; padding: 15px 16px 8px 18px; border: 0; border-radius: var(--r-card) var(--r-card) 0 0; background: none; color: var(--ink); font: inherit; text-align: left; }
button.bt-h { cursor: pointer; }
button.bt-h:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.bt-ico { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 11px; background: var(--sunk); }
.bt-ico .ico { width: 19px; height: 19px; color: var(--ink); --pen: var(--red); }
.bt-t { display: grid; gap: 1px; min-width: 0; }
.bt-t b { font: 800 15.5px/1.2 var(--f-ui); }
.bt-t small { font: 600 12px/1.25 var(--f-ui); color: var(--ink-3); }
.bt-x { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px 6px 11px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); font: 700 12px/1 var(--f-ui); transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.bt-x .ico { width: 15px; height: 15px; --pen: currentColor; }
button.bt-h:hover .bt-x, .btile.open .bt-x { background: var(--accent); color: var(--accent-ink); }
@container (max-width: 330px) { .bt-x > span { display: none; } .bt-x { padding: 7px; } }
.bt-body { display: grid; gap: 16px; min-width: 0; padding: 6px 18px 18px; align-content: start; }
.bt-pair { display: grid; gap: 18px 22px; min-width: 0; }
.bt-face { container-type: inline-size; display: grid; gap: 12px; min-width: 0; align-content: start; }
.bt-more, .bt-wide { container-type: inline-size; display: grid; gap: 16px; min-width: 0; align-content: start; }
/* The face column is exactly as wide as the face was in the closed tile: a closed tile is span/12 of (the band
   + a 16px gap) less the gap, less its padding and border (54px in all), so the face doesn't move as it opens. */
.btile.open:not(.full) .bt-pair { grid-template-columns: minmax(0, calc(var(--span) / 12 * (100% + 54px) - 54px)) minmax(0, 1fr); align-items: start; }
.btile.open:not(.full) .bt-face { position: sticky; top: 16px; }
@media (max-width: 880px) { .btile.open:not(.full) .bt-face { top: calc(var(--rail-h, 0px) + 12px); } }
@container (max-width: 760px) { .btile.open:not(.full) .bt-pair { grid-template-columns: minmax(0, 1fr); } .btile.open .bt-face { position: static; } }
.bt-foot { display: flex; justify-content: flex-end; }
.bt-foot .btn .ico { width: 15px; height: 15px; }
/* Inside a tile, the details' cards lie flat on it. */
.bt-more .dash-card, .bt-wide .dash-card { box-shadow: none; background: color-mix(in srgb, var(--sunk) 45%, var(--surface)); padding: 16px 16px 18px; }
.bt-more .dash-grid, .bt-wide .dash-grid { gap: 12px; }
.bt-hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 0; }
.bt-hero b { display: inline-flex; align-items: baseline; gap: 6px; font: 800 27px/1.1 var(--f-ui); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.bt-hero b small { font-size: 15px; letter-spacing: 0; color: var(--ink-3); }
.bt-hero b .leaf-ico { width: 21px; height: 23px; align-self: center; }
.bt-hero > span { font-size: 13px; line-height: 1.4; color: var(--ink-3); min-width: 0; }
.bento-foot { margin: 4px 2px 0; }
/* The week ahead: the plan's minutes over the cards due, the same days under each. */
.ahead { display: grid; gap: 4px; }
.ah-cap { font: 800 11px/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.ahead .c-chart + .ah-cap { margin-top: 8px; }
/* Grammar topics as rings, Compréhension's two rows. */
.g-rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 12px 8px; }
.g-ring { display: grid; justify-items: center; gap: 6px; padding: 8px 4px; border-radius: 14px; color: var(--ink); text-decoration: none; text-align: center; transition: background-color var(--dur-fast) var(--ease); }
.g-ring:hover { background: var(--sunk); }
.g-ring small { font: 700 11.5px/1.25 var(--f-ui); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cf { display: grid; }
.cf-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "sk t sp" "sk x x"; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.cf-row:last-child { border-bottom: 0; }
.cf-row > .sk { grid-area: sk; align-self: start; }
.cf-t { grid-area: t; display: grid; gap: 1px; min-width: 0; }
.cf-t b { font: 800 19px/1.1 var(--f-ui); font-variant-numeric: tabular-nums; }
.cf-t small, .cf-x small { font-size: 12px; color: var(--ink-3); }
.cf-row > .c-spark { grid-area: sp; }
.cf-x { grid-area: x; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 700 13px/1.2 var(--f-ui); }
.btile .stamps { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; }
.bt-face .since-heat .heat { grid-template-rows: repeat(7, 17px); grid-auto-columns: 17px; gap: 4px; }
.btile .stamp { max-width: 84px; }
.ex-face { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.ex-face div { padding: 12px 14px; }
.btile #sec-pass .pass { max-width: none; }
/* The radar: the four skills on the NCLC scale, marks in HTML over the SVG. */
.c-radar { margin: 0; }
.c-rbox { position: relative; width: 100%; max-width: 420px; margin: 0 auto; }
.c-rsvg { display: block; width: 100%; height: 100%; overflow: visible; }
.c-rr { fill: none; stroke: var(--c-grid); stroke-width: 1; }
.c-redge { stroke: var(--rule-2); }
.c-rtarget { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 4; fill: color-mix(in srgb, var(--green) 6%, transparent); }
.c-rs { stroke: var(--c-grid); stroke-width: 1; }
.c-rfig { transform-box: view-box; transform-origin: 50% 50%; }
.c-rshape { fill: color-mix(in srgb, var(--c) 16%, transparent); stroke: var(--c); stroke-width: 2; stroke-linejoin: round; }
.c-rseg { stroke: var(--c); stroke-width: 2; stroke-linecap: round; }
.c-rdot { position: absolute; z-index: 2; width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2.5px var(--surface); translate: -50% -50%; transition: scale var(--dur-fast) var(--ease); }
.c-rdot::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; }
.c-rdot.c-on { scale: 1.45; }
.c-rlab { position: absolute; display: grid; gap: 1px; white-space: nowrap; pointer-events: none; }
.c-rlab b { font: 800 12.5px/1.2 var(--f-ui); color: var(--ink); }
.c-rlab small { font: 700 11.5px/1.2 var(--f-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.c-rlab.none small { font-weight: 600; color: var(--ink-3); font-style: italic; }
.c-rlab.top { translate: -50% -100%; text-align: center; justify-items: center; }
.c-rlab.bottom { translate: -50% 0; text-align: center; justify-items: center; }
.c-rlab.right { translate: 0 -50%; }
.c-rlab.left { translate: -100% -50%; text-align: right; justify-items: end; }
/* A side label has the room between the radar and the edge (78 of the box's 360 units), and wraps inside it. */
.c-rlab.left, .c-rlab.right { width: max-content; max-width: 21.5%; white-space: normal; }
.c-rtl { position: absolute; translate: 8px -50%; padding: 1px 6px; border-radius: 6px; background: var(--surface); color: var(--ink-2); font: 800 10.5px/1.4 var(--f-ui); white-space: nowrap; pointer-events: none; }

/* Opening a tile (motion.js, TCFMotion.expand): every tile is named for the moment, so each one's place and size
   morph together. The pictures aren't stretched: each is drawn at its own size from the top left and clipped by
   the growing box, the old one cross-fading into the new one, and the box carries the tile's shadow. The page
   behind (the root) doesn't cross-fade, so nothing ghosts. */
:root[data-vt="bento"] .btile, :root[data-vt="bento"] .bento-foot { view-transition-name: var(--vtn); }
:root[data-vt="bento"]::view-transition-old(root) { display: none; }
:root[data-vt="bento"]::view-transition-new(root), :root[data-vt="bento"]::view-transition-new(rail) { animation: none; mix-blend-mode: normal; }
:root[data-vt="bento"]::view-transition-group(*) { animation-duration: .48s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); border-radius: var(--r-card); box-shadow: var(--shadow); }
:root[data-vt="bento"]::view-transition-group(root), :root[data-vt="bento"]::view-transition-group(rail), :root[data-vt="bento"]::view-transition-group(bt-foot) { border-radius: 0; box-shadow: none; }
:root[data-vt="bento"]::view-transition-image-pair(*) { isolation: isolate; overflow: clip; border-radius: var(--r-card); }
:root[data-vt="bento"]::view-transition-image-pair(root), :root[data-vt="bento"]::view-transition-image-pair(rail) { overflow: visible; border-radius: 0; }
:root[data-vt="bento"]::view-transition-old(*), :root[data-vt="bento"]::view-transition-new(*) { height: 100%; object-fit: none; object-position: left top; mix-blend-mode: plus-lighter; }
/* The two pictures fade with the same timing (and the browser adds them up), so a tile that only moves never dims. */
:root[data-vt="bento"]::view-transition-old(*) { animation: vt-fade-out .3s cubic-bezier(.4, 0, .2, 1) both; }
:root[data-vt="bento"]::view-transition-new(*) { animation: vt-fade-in .3s cubic-bezier(.4, 0, .2, 1) both; }

/* ---------- Fiches: a desk of revision cards ---------- */
/* Each kind of sheet has its colour (the band, the table headings), from the skill palette. */
.t-grammaire { --tc: var(--c-gra); --tci: var(--sk-gra); }
.t-ecrit { --tc: var(--c-ee); --tci: var(--sk-ee); }
.t-oral { --tc: var(--c-co); --tci: var(--sk-co); }
.t-vocabulaire { --tc: var(--c-voc); --tci: var(--sk-voc); }
.t-examen { --tc: var(--c-bil); --tci: var(--sk-bil); }
/* An order chain's slots: numbered as well as coloured, so the colour is never the only cue. The order passes the
   colour-blindness check for neighbouring slots in both themes (blue, green, violet, pink, amber, teal). */
.s1 { --sc: var(--c-gra); } .s2 { --sc: var(--c-ce); } .s3 { --sc: var(--c-ee); } .s4 { --sc: var(--c-bil); } .s5 { --sc: var(--c-voc); } .s6 { --sc: var(--c-co); }

.fx-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.fx-hand { margin: 0; font: 400 16px/1.5 var(--f-hand); color: var(--accent); }
.fx-head .btn .ico { width: 17px; height: 17px; }

/* Pense-bête: sticky notes on a dotted board. */
.fx-board { display: grid; gap: 14px; padding: 16px 18px 22px; border-radius: var(--r-card); border: 1px solid var(--rule); background-color: var(--sunk); background-image: radial-gradient(color-mix(in srgb, var(--rule-2) 90%, transparent) 1px, transparent 1.4px); background-size: 18px 18px; }
.fx-board .h3 { margin: 0; }
.fx-pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 20px 16px; align-items: start; }
.fx-pin { --nb: var(--note-1); position: relative; min-height: 132px; display: grid; align-content: space-between; gap: 6px; padding: 22px 14px 8px; background: var(--nb); border-radius: 3px 3px 16px 3px; box-shadow: 0 1px 1px rgb(var(--shade) / .07), 0 12px 20px -14px rgb(var(--shade) / .55); rotate: var(--tilt, 0deg); transition: rotate var(--dur) var(--ease), translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.fx-pin.t2 { --nb: var(--note-2); } .fx-pin.t3 { --nb: var(--note-3); } .fx-pin.t4 { --nb: var(--note-4); }
.fx-pin:hover { rotate: 0deg; translate: 0 -3px; box-shadow: 0 2px 3px rgb(var(--shade) / .08), 0 18px 26px -16px rgb(var(--shade) / .6); }
.fx-pin .tape, .fx-note .tape { position: absolute; top: -10px; left: calc(50% - 34px); width: 68px; height: 20px; background: var(--tape); rotate: 3deg; border-left: 1px dashed color-mix(in srgb, var(--accent) 30%, transparent); border-right: 1px dashed color-mix(in srgb, var(--accent) 30%, transparent); }
.fx-pin p { margin: 0; font: 400 13.5px/1.85 var(--f-hand); color: var(--ink); overflow-wrap: anywhere; }
.fx-pin-acts { display: flex; justify-content: flex-end; gap: 2px; opacity: 0; transition: opacity var(--dur-fast); }
.fx-pin-acts .btn { padding: 4px 8px; }
.fx-pin:hover .fx-pin-acts, .fx-pin:focus-within .fx-pin-acts { opacity: 1; }
@media (hover: none) { .fx-pin-acts { opacity: 1; } }
.fx-pin-new { cursor: text; background: color-mix(in srgb, var(--nb) 50%, transparent); box-shadow: none; outline: 1.5px dashed color-mix(in srgb, var(--ink-3) 45%, transparent); outline-offset: -1.5px; }
.fx-pin-new:focus-within { background: var(--nb); outline-color: transparent; box-shadow: 0 12px 20px -14px rgb(var(--shade) / .55); }
.fx-pin-new textarea, .fx-pin-new textarea:focus { width: 100%; min-height: 92px; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; resize: none; font: 400 13.5px/1.85 var(--f-hand); color: var(--ink); }
.fx-pin-new textarea::placeholder { color: color-mix(in srgb, var(--ink-3) 75%, transparent); }

/* The filter chips (with a highlight that glides) and the search. */
.fx-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.fx-chips { position: relative; display: flex; gap: 2px; max-width: 100%; padding: 4px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); box-shadow: var(--shadow-sm); overflow-x: auto; scrollbar-width: none; }
.fx-chips::-webkit-scrollbar { display: none; }
.fx-chips button { position: relative; z-index: 1; flex: none; padding: 7px 12px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font: 700 13px/1 var(--f-ui); white-space: nowrap; cursor: pointer; transition: color .25s var(--ease); }
.fx-chips button .num { margin-left: 2px; font-weight: 600; opacity: .7; }
.fx-chips button:hover { color: var(--ink); }
.fx-chips button[aria-pressed="true"] { color: var(--accent-ink); }
.fx-chip-pill { position: absolute; z-index: 0; left: 0; top: 0; border-radius: 999px; background: var(--accent); box-shadow: 0 3px 10px -3px color-mix(in srgb, var(--accent) 70%, transparent); pointer-events: none; transition: transform .38s var(--ease), width .38s var(--ease), opacity .2s; }
.fx-search { display: flex; align-items: center; gap: 8px; flex: 1 1 240px; min-width: 0; max-width: 380px; padding: 0 14px; border: 1px solid var(--rule-2); border-radius: 999px; background: var(--surface); transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.fx-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.fx-search .ico { flex: none; width: 16px; height: 16px; color: var(--ink-3); }
.fx-search input[type="search"], .fx-search input[type="search"]:focus { flex: 1; min-width: 0; padding: 10px 0; border: 0; background: none; box-shadow: none; }

/* The bristol cards: a coloured band, faint blue rules and a red margin, slightly askew on the desk. */
.fx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 22px 20px; perspective: 1200px; }
.fx-card { position: relative; isolation: isolate; display: flex; flex-direction: column; min-width: 0; min-height: 214px; overflow: hidden; border: 1px solid var(--rule); border-radius: 6px 6px 16px 6px; background: var(--surface); color: var(--ink); text-decoration: none; box-shadow: 0 1px 2px rgb(var(--shade) / .08), 0 14px 28px -18px rgb(var(--shade) / .45); rotate: var(--tilt, 0deg); transition: rotate var(--dur) var(--ease), translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.fx-card:hover, .fx-card:focus-visible { rotate: 0deg; translate: 0 -5px; box-shadow: var(--shadow-lg); }
.fx-card:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; }
.fx-card[hidden] { display: none; }
.fx-band { display: flex; align-items: center; gap: 7px; padding: 9px 14px; background: color-mix(in srgb, var(--tc) 15%, var(--surface)); border-bottom: 2px solid color-mix(in srgb, var(--tc) 60%, transparent); color: var(--tci); font: 800 11.5px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; }
.fx-band .ico { width: 15px; height: 15px; --pen: currentColor; }
.fx-mine { margin-left: auto; font: 400 12px/1 var(--f-hand); letter-spacing: 0; text-transform: none; color: var(--red); }
.fx-paper { position: relative; flex: 1; display: flex; flex-direction: column; padding: 6px 16px 10px 32px; background-image: repeating-linear-gradient(to bottom, transparent 0 25px, var(--seyes-2) 25px 26px); background-position: 0 5px; line-height: 26px; }
.fx-paper::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; border-left: 1.5px solid var(--margin); }
.fx-title { font: 600 17px/26px var(--f-text); text-wrap: balance; }
.fx-paper .fx-en { font-size: 12.5px; line-height: 26px; color: var(--ink-3); }
.fx-prev { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; font: 400 13.5px/26px var(--f-text); color: var(--ink-2); -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); }
.fx-foot { display: flex; justify-content: space-between; gap: 8px; padding: 8px 14px 10px; border-top: 1px dashed var(--rule); font-size: 11.5px; color: var(--ink-3); }

/* One sheet. */
.fx-view { max-width: 940px; }
.fx-sheet { position: relative; border: 1px solid var(--rule); border-radius: 8px 8px 24px 8px; background: var(--surface); box-shadow: var(--shadow-lg); }
.fx-sheet::before { content: ""; position: absolute; left: 40px; top: 36px; bottom: 0; border-left: 1.5px solid var(--margin); pointer-events: none; }
.fx-sheet > .fx-sheet-head > .fx-band { border-radius: 8px 8px 0 0; padding: 10px 18px; }
.fx-sheet-title { padding: 18px 28px 4px 58px; }
.fx-h1 { margin: 0; font: 600 clamp(24px, 3.4vw, 32px)/1.2 var(--f-text); text-wrap: balance; }
.fx-sheet .fx-sheet-title .fx-en { margin: 4px 0 0; font-size: 14px; color: var(--ink-3); }
.fx-sheet-acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 28px 2px 58px; }
.fx-cacher-tip { margin: 8px 28px 0 58px; color: var(--accent); }
/* Its margins count against max-width, so a sheet with many sections stays inside the card. */
.fx-toc { margin: 14px 28px 0 58px; max-width: calc(100% - 86px); }
.fx-body { display: grid; gap: 22px; padding: 10px 28px 26px 58px; container-type: inline-size; }
.fx-scope { display: grid; gap: 14px; min-width: 0; }
.fx-body p { margin: 0; }
.fx-body > .fx-scope > p, .fx-list { font: 400 15.5px/1.6 var(--f-text); }
.fx-h { position: relative; justify-self: start; margin: 14px 0 2px; scroll-margin-top: 96px; font: 800 19px/1.3 var(--f-ui); }
.fx-scope:first-child > .fx-h:first-child { margin-top: 4px; }
.fx-h .ink { position: absolute; left: -3px; right: -8px; bottom: -5px; height: 3px; border-radius: 3px; background: var(--red); opacity: .85; rotate: -.7deg; transform-origin: left center; }
.fx-h3 { margin: 4px 0 0; font: 800 15px/1.3 var(--f-ui); color: var(--ink-2); }
.fx-list { display: grid; gap: 6px; margin: 0; padding-left: 20px; }
.fx-list li::marker { color: var(--red); }
.fx-body mark.hl { padding: 0 2px; border-radius: 2px; background: linear-gradient(transparent 50%, var(--hl) 50%, var(--hl) 92%, transparent 92%); color: inherit; }
.fx-body .pen-wrong { font-family: inherit; }
.fx-body .pen-right { font-size: .92em; line-height: 1.5; }

/* The order chain. Hovering or tapping a slot lights its words in the examples below it, in its colour. */
.fx-chain { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
.fx-slot { flex: 1 1 96px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 8px; border: 1.5px solid color-mix(in srgb, var(--sc) 70%, transparent); border-radius: 14px; background: color-mix(in srgb, var(--sc) 11%, var(--surface)); color: var(--ink); font: inherit; cursor: pointer; transition: translate var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur); }
.fx-slot:hover, .fx-slot:focus-visible { translate: 0 -3px; box-shadow: 0 10px 20px -12px color-mix(in srgb, var(--sc) 90%, transparent); }
.fx-slot .num { display: grid; place-items: center; width: 23px; height: 23px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--sc); font: 800 12px/1 var(--f-ui); color: var(--ink); }
.fx-slot .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.fx-slot .chip { padding: 2px 6px; border-radius: 7px; background: color-mix(in srgb, var(--sc) 16%, var(--surface)); font: 600 16px/1.25 var(--f-text); }
.fx-slot .lab { font: 700 11px/1.3 var(--f-ui); color: var(--ink-2); text-align: center; }
.fx-slot.verb { flex: 0 0 auto; min-width: 84px; justify-content: center; border-color: var(--ink); background: var(--ink); color: var(--surface); font: 800 12.5px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; cursor: default; }
.fx-slot.verb:hover { translate: none; box-shadow: none; }
.fx-arrow { align-self: center; color: var(--ink-3); font-weight: 800; }
.fx-scope .sw { padding: 0 1px; border-radius: 4px; box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--sc) 85%, transparent); transition: background-color .2s, box-shadow .2s; }
/* A word split in two (a stem and its ending) reads as one word. */
.fx-scope .sw:has(+ .sw) { padding-right: 0; } .fx-scope .sw + .sw { padding-left: 0; }
.fx-scope:has(.fx-slot.s1:hover) .sw.s1, .fx-scope[data-lit="1"] .sw.s1,
.fx-scope:has(.fx-slot.s2:hover) .sw.s2, .fx-scope[data-lit="2"] .sw.s2,
.fx-scope:has(.fx-slot.s3:hover) .sw.s3, .fx-scope[data-lit="3"] .sw.s3,
.fx-scope:has(.fx-slot.s4:hover) .sw.s4, .fx-scope[data-lit="4"] .sw.s4,
.fx-scope:has(.fx-slot.s5:hover) .sw.s5, .fx-scope[data-lit="5"] .sw.s5,
.fx-scope:has(.fx-slot.s6:hover) .sw.s6, .fx-scope[data-lit="6"] .sw.s6 { background: color-mix(in srgb, var(--sc) 30%, transparent); box-shadow: inset 0 -3px 0 var(--sc); }
.fx-scope[data-lit="1"] .fx-slot.s1, .fx-scope[data-lits~="1"] .fx-slot.s1,
.fx-scope[data-lit="2"] .fx-slot.s2, .fx-scope[data-lits~="2"] .fx-slot.s2,
.fx-scope[data-lit="3"] .fx-slot.s3, .fx-scope[data-lits~="3"] .fx-slot.s3,
.fx-scope[data-lit="4"] .fx-slot.s4, .fx-scope[data-lits~="4"] .fx-slot.s4,
.fx-scope[data-lit="5"] .fx-slot.s5, .fx-scope[data-lits~="5"] .fx-slot.s5,
.fx-scope[data-lit="6"] .fx-slot.s6, .fx-scope[data-lits~="6"] .fx-slot.s6 { translate: 0 -3px; background: color-mix(in srgb, var(--sc) 22%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 35%, transparent); }

/* Example lines: tap one to light up the slots its words come from. */
.fx-exs { display: grid; gap: 2px; }
.fx-ex { display: grid; gap: 1px; margin: 0 -10px; padding: 6px 10px; border-radius: 10px; cursor: pointer; transition: background-color var(--dur-fast); }
.fx-ex:hover { background: var(--hover); }
.fx-ex.on { background: var(--accent-soft); }
.fx-ex.on .sw { background: color-mix(in srgb, var(--sc) 30%, transparent); box-shadow: inset 0 -3px 0 var(--sc); }
.fx-ex .fr { font: 400 17px/1.45 var(--f-text); }
.fx-ex .en { font-size: 13px; color: var(--ink-3); }

.fx-tw { margin: 0; }
.fx-table { width: 100%; overflow: hidden; border: 1px solid var(--rule); border-radius: 12px; border-collapse: separate; border-spacing: 0; background: var(--surface); font-size: 14.5px; }
.fx-table th { padding: 9px 12px; background: color-mix(in srgb, var(--tc, var(--accent)) 12%, var(--surface)); color: var(--tci, var(--accent)); font: 800 11.5px/1.3 var(--f-ui); letter-spacing: .05em; text-align: left; text-transform: uppercase; }
.fx-table td { padding: 9px 12px; border-top: 1px solid var(--rule); font-family: var(--f-text); vertical-align: top; transition: background-color var(--dur-fast); }
.fx-table td:first-child { font: 700 14px/1.45 var(--f-ui); }
.fx-table tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--sunk) 50%, transparent); }
.fx-table tbody tr:hover td { background: var(--hover); }

/* The memory trick, taped on; and the red-pen warning, its label circled. */
.fx-note { --nb: var(--note-1); position: relative; justify-self: start; max-width: 600px; padding: 20px 20px 12px; border-radius: 3px 3px 16px 3px; background: var(--nb); box-shadow: 0 12px 22px -16px rgb(var(--shade) / .6); rotate: var(--tilt, -1deg); }
.fx-note p { font: 400 14px/1.9 var(--f-hand); color: var(--ink); }
.fx-note b { color: var(--accent); font-weight: 400; }
.fx-warn { position: relative; display: grid; gap: 8px; padding: 14px 16px; border: 1.5px dashed color-mix(in srgb, var(--red) 70%, transparent); border-radius: 14px; background: color-mix(in srgb, var(--red-soft) 75%, transparent); }
.fx-warn-h { position: relative; justify-self: start; margin: 0; padding: 3px 12px; color: var(--red); font: 800 12px/1.4 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; }
.fx-warn-h svg { position: absolute; left: -6px; top: -6px; width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible; pointer-events: none; }
.fx-warn-h path { fill: none; stroke: var(--red); stroke-width: 2.2; stroke-linecap: round; }
.fx-warn > p:last-child { font: 400 15.5px/1.6 var(--f-text); }
.fx-sheet-foot { padding: 12px 28px 18px 58px; border-top: 1px dashed var(--rule); }

/* Cacher: the answers become dotted blanks; a tap turns one over. */
.fx-sheet.cacher :is(.chip, mark.hl, .pen-right):not(.shown), .fx-sheet.cacher td:not(:first-child):not(.shown) { color: transparent !important; text-shadow: none; cursor: pointer; border-radius: 5px; background: repeating-linear-gradient(90deg, var(--ink-3) 0 3px, transparent 3px 7px) left bottom / 100% 1.5px no-repeat, color-mix(in srgb, var(--sunk) 85%, transparent) !important; }
.fx-sheet.cacher td:not(:first-child):not(.shown) * { color: transparent !important; background: none !important; box-shadow: none !important; }
.fx-sheet.cacher .fx-scope .sw { box-shadow: none; }

/* The tab on a grammar topic or a writing task. */
.fx-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.fx-tab { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px; border: 1px solid var(--rule); border-top: 3px solid var(--tc); border-radius: 4px 4px 12px 4px; background: var(--surface); box-shadow: var(--shadow-sm); color: var(--ink-2); font-size: 13.5px; text-decoration: none; rotate: -.6deg; transition: rotate var(--dur) var(--ease), translate var(--dur) var(--ease), box-shadow var(--dur); }
.fx-tab b { font: 600 14px/1.3 var(--f-text); color: var(--ink); }
.fx-tab .ico { width: 16px; height: 16px; color: var(--tci); --pen: var(--red); }
.fx-tab:hover { rotate: 0deg; translate: 0 -2px; box-shadow: var(--shadow); }

/* The editor, with its live preview. */
.fx-edit { max-width: 1260px; }
.fx-edit-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.fx-prev-wrap { position: sticky; top: 16px; display: grid; gap: 8px; min-width: 0; }
.fx-prev-wrap .eyebrow { margin: 0; }
.fx-preview { box-shadow: var(--shadow); }
.fx-etags { display: flex; flex-wrap: wrap; gap: 6px; }
.fx-etags button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1.5px solid var(--rule-2); border-radius: 999px; background: var(--surface); color: var(--ink-2); font: 700 13px/1 var(--f-ui); cursor: pointer; transition: border-color var(--dur-fast), background-color var(--dur-fast), color var(--dur-fast); }
.fx-etags button .ico { width: 15px; height: 15px; --pen: currentColor; }
.fx-etags button[aria-pressed="true"] { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--surface)); color: var(--tci); }
.fx-bar { display: flex; flex-wrap: wrap; gap: 6px; }
#fx-body { font: 400 13.5px/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.fx-help td { padding: 4px 12px 4px 0; vertical-align: top; font-size: 13px; }
.fx-help code { font-size: 12.5px; white-space: nowrap; }

@media (max-width: 980px) {
  .fx-edit-grid { grid-template-columns: minmax(0, 1fr); }
  .fx-prev-wrap { position: static; }
}
@media (max-width: 640px) {
  .fx-grid { grid-template-columns: minmax(0, 1fr); }
  .fx-pins { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
  .fx-sheet::before { left: 22px; }
  .fx-sheet-title, .fx-sheet-acts, .fx-body, .fx-sheet-foot { padding-left: 34px; padding-right: 16px; }
  .fx-cacher-tip, .fx-toc { margin-left: 34px; margin-right: 16px; }
  .fx-toc { max-width: calc(100% - 50px); }
  .fx-table th, .fx-table td { padding: 8px; }
}
/* A chain that can't fit on one line stacks, one slot per row, with the arrows pointing down. */
@container (max-width: 620px) {
  .fx-chain { flex-direction: column; align-items: stretch; }
  .fx-slot { flex: none; flex-direction: row; flex-wrap: wrap; justify-content: flex-start; }
  .fx-slot .lab { margin-left: auto; text-align: right; }
  .fx-slot.verb { min-height: 40px; }
  .fx-arrow { rotate: 90deg; line-height: .7; }
}
@media (prefers-reduced-motion: reduce) {
  .fx-card, .fx-pin, .fx-slot, .fx-tab { transition: none; }
}
/* Under a mouse, cards light up where the pointer is, and tiles tilt toward it (motion.js sets --sx, --sy). */
@media (hover: hover) and (pointer: fine) {
  [data-tilt] { transition: rotate .6s var(--ease), translate .35s var(--ease), box-shadow .35s var(--ease), border-color .2s; }
  [data-tilt].m-tilting { transition: rotate .1s linear, translate .35s var(--ease), box-shadow .35s var(--ease), border-color .2s; }
  .kpi:hover { translate: 0 -3px; box-shadow: var(--shadow-lg); }
  [data-spot]::before, .kpi::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: radial-gradient(440px circle at var(--sx, 50%) var(--sy, 0%), color-mix(in srgb, var(--accent) 7%, transparent), transparent 62%); opacity: 0; transition: opacity .4s var(--ease); pointer-events: none; }
  [data-spot]::after, .kpi::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: radial-gradient(260px circle at var(--sx, 50%) var(--sy, 0%), color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; opacity: 0; transition: opacity .4s var(--ease); pointer-events: none; }
  [data-spot]:hover::before, [data-spot]:hover::after, .kpi:hover::before, .kpi:hover::after { opacity: 1; }
}

/* ---------- mini charts on the other pages ---------- */
/* The planned minutes behind each day's column, as an outline. */
.c-gcol { position: absolute; bottom: 0; left: 50%; translate: -50% 0; width: min(100%, 26px); border-radius: 6px 6px 2px 2px; background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 28%, transparent); }
.mini-week, .v-week { display: grid; gap: 6px; }
.v-home > .panel { align-content: start; }
.mini-week .c-plot, .v-week .c-plot { margin-top: 2px; }
.mini-week .c-xs span, .v-week .c-xs span { top: 3px; }
.topics .meta .c-ring b { font-size: 10.5px; }
.w-trend { display: grid; gap: 8px; padding: 14px 18px 12px; }
.h-node > summary .c-spark { flex: none; }
[data-spot] { position: relative; isolation: isolate; }

/* ---------- changing page (View Transitions, started by motion.js) ---------- */
/* The sidebar stays still while the page slides: forward along the navigation to the left, back to the right,
   and a page within the same section rises in place. */
:root[data-vt] .rail { view-transition-name: rail; }
::view-transition-old(rail) { display: none; }
::view-transition-new(rail) { animation: none; }
::view-transition-old(root) { animation: vt-fade-out .2s cubic-bezier(.4, 0, 1, 1) both; }
::view-transition-new(root) { animation: vt-fade-in .34s cubic-bezier(.2, .8, .2, 1) .04s both; }
:root[data-vt="fwd"]::view-transition-old(root) { animation-name: vt-out-left; }
:root[data-vt="fwd"]::view-transition-new(root) { animation-name: vt-in-right; }
:root[data-vt="back"]::view-transition-old(root) { animation-name: vt-out-right; }
:root[data-vt="back"]::view-transition-new(root) { animation-name: vt-in-left; }
:root[data-vt="up"]::view-transition-new(root) { animation-name: vt-in-up; }
@keyframes vt-out-left { to { opacity: 0; transform: translateX(-32px); } }
@keyframes vt-in-right { from { opacity: 0; transform: translateX(44px); } }
@keyframes vt-out-right { to { opacity: 0; transform: translateX(32px); } }
@keyframes vt-in-left { from { opacity: 0; transform: translateX(-44px); } }
@keyframes vt-in-up { from { opacity: 0; transform: translateY(14px); } }
@keyframes vt-fade-out { to { opacity: 0; } }
@keyframes vt-fade-in { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }

/* ---------- motion (motion.js) ---------- */
/* For a moment after switching light and dark, colours fade instead of snapping (motion.js adds the class). */
:root.theme-fade, :root.theme-fade * { transition: background-color .35s ease, color .35s ease, border-color .35s ease, fill .35s ease, stroke .35s ease !important; }
/* The maple leaves that fly off a stamp or a perfect score. */
.m-burst { position: fixed; z-index: 40; width: 0; height: 0; pointer-events: none; }
.m-burst svg { position: absolute; left: -10px; top: -11px; width: 20px; height: 22px; overflow: visible; }
/* Grading (motion.js): a light halo around the button you pressed, in its grade's colour (pale ink, blue ink, the
   reward gold), which grows a few pixels and fades; on Again it gives a small shake in red pen. */
.m-halo { position: fixed; z-index: 30; pointer-events: none; box-sizing: border-box; border: 2px solid currentColor; border-radius: var(--r); }
.m-halo.g1 { color: var(--red); }
.m-halo.g2 { color: var(--ink-3); }
.m-halo.g3 { color: var(--accent); }
.m-halo.g4 { color: var(--leaf-2); }
</style>
