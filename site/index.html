  --accent-ink: #FFFFFF;
  --accent-soft: #E5EEF9;
  --red: #C62F24;
  --red-soft: #FCEAE6;

  --fur: #9D958E; --fur-dark: #766D67; --muzzle: #EEE7E0; --ear-in: #F0AAA5; --m-ink: #2B1D15; --m-nose: #E07A87; --tail: #E6A19C; --tooth: #FFFDF6; --blush: #EE9A8F;

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15.5px/1.55 var(--f-ui); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
a { color: var(--accent); text-underline-offset: .18em; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .btn:hover, .btn:active, .daychip:hover, .daychip:active, .choices button:hover, .choices button:active { transform: none !important; }
}

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: 26px 16px 20px; border-right: 1px solid var(--rule); background: var(--paper); }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); padding: 0 6px; min-width: 0; }
.brand .tile { width: 38px; height: 38px; flex: none; filter: drop-shadow(0 2px 3px rgb(var(--shade) / .14)); transition: transform var(--dur) var(--ease); }
.brand:hover .tile { transform: rotate(-6deg) scale(1.05); }
.theme-btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1.5px solid var(--rule-2); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer; white-space: nowrap; transition: color var(--dur-fast), border-color var(--dur-fast); }
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.theme-btn svg { width: 14px; height: 14px; flex: none; }
.rail-foot .theme-btn { justify-self: start; }
.rail-top .theme-btn { display: none; }
.brand b { display: block; font: 800 18.5px/1.1 var(--f-ui); letter-spacing: -.015em; }
.brand small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-top: 3px; }
.nav { position: relative; display: grid; gap: 3px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--r); color: var(--ink-2); text-decoration: none; font-weight: 700; font-size: 15px; transition: color var(--dur-fast), background-color var(--dur-fast); }
.nav a .ico { width: 20px; height: 20px; color: var(--ink-3); --pen: currentColor; transition: color var(--dur-fast), transform var(--dur) var(--ease); }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a:hover .ico { transform: translateY(-1px) rotate(-4deg); }
/* The red pen of each icon only shows on the page you're on. */
.nav a:hover .ico, .nav a[aria-current="page"] .ico { color: var(--ink); --pen: var(--red); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--rule); }
/* With motion.js the highlight is one pill that glides to the page you open (it sits behind the links). */
.nav-pill { position: absolute; z-index: 0; left: 0; top: 0; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--rule); pointer-events: none; transition: transform var(--dur) var(--ease), width var(--dur) var(--ease), height var(--dur) var(--ease); }
.nav.has-pill a[aria-current="page"] { background: transparent; box-shadow: none; }
.rail-foot { margin-top: auto; display: grid; gap: 10px; padding: 0 4px; font-size: 12.5px; color: var(--ink-3); }
.mini-timer { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font-variant-numeric: tabular-nums; text-decoration: none; }
.mini-timer .ico { width: 16px; height: 16px; }
.mini-timer b { font-size: 16px; margin-left: auto; }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: 1px; }
.status-dot.on { background: var(--green); }
.status-dot.warn { background: var(--amber); }
/* Where your progress is saved, and whether Claude is ready: one line, with the details a tap away. */
.status > summary { display: inline-flex; align-items: center; cursor: pointer; list-style: none; padding: 2px 4px; margin-left: -4px; border-radius: 6px; font-weight: 600; }
.status > summary::-webkit-details-marker { display: none; }
.status > summary:hover { color: var(--ink-2); background: var(--hover); }
.status > div { display: grid; gap: 4px; margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--sunk); }
main { min-width: 0; padding-block: 32px 88px; padding-inline: 44px; }
/* One column that never grows past the page, so a wide row (a tab tray, a table) scrolls inside it instead. */
.wrap { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
/* A task in progress (a drill round, a text to proofread, an exam) gets a narrower page with nothing beside it. */
.wrap.focus { max-width: 760px; gap: 22px; }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: column; gap: 8px; padding: 12px 16px 8px; border-right: 0; border-bottom: 1px solid var(--rule); }
  .brand { padding: 0; gap: 9px; }
  .brand .tile { width: 30px; height: 30px; }
  .brand b { font-size: 17.5px; }
  .brand small { display: none; }
  .nav { grid-auto-flow: column; justify-content: start; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; gap: 4px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; gap: 7px; padding: 7px 12px; font-size: 14px; border-radius: 999px; }
  .nav-pill { border-radius: 999px; }
  .nav a .ico { width: 17px; height: 17px; }
  .rail-foot { display: none; }
  .rail-top .theme-btn { display: inline-flex; padding: 6px 10px; }
  main { padding-inline: 16px; padding-block: 20px 64px; }
}

/* ---------- type ---------- */
h1, h2, h3 { text-wrap: balance; margin: 0; }
.title { font: 800 32px/1.12 var(--f-ui); letter-spacing: -.02em; }
.title small { display: block; margin-top: 6px; font: 500 15px/1.45 var(--f-ui); color: var(--ink-2); letter-spacing: 0; }
.h2 { font: 800 20px/1.25 var(--f-ui); letter-spacing: -.01em; }
.h3 { font: 700 15.5px/1.3 var(--f-ui); }
.eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.lede { color: var(--ink-2); max-width: 66ch; margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13.5px; }
.fr { font-family: var(--f-text); }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }
.prose { display: grid; gap: 10px; max-width: 70ch; }

/* ---------- building blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-card); padding: 22px; box-shadow: var(--shadow); }
.panel.flat { box-shadow: none; }
.stack { display: grid; gap: 14px; }
.stack.tight { gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
@media (max-width: 1100px) { .grid-side { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 700px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
section.sec { display: grid; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
hr.rule { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }

/* Buttons sit on a lip (--lip-h) that presses down when you click. */
.btn { --lip: var(--rule-2); --lip-h: 2px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border-radius: var(--r); border: 1.5px solid var(--rule-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14.5px; line-height: 1.1; cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: 0 var(--lip-h) 0 var(--lip); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), border-color var(--dur-fast), background-color var(--dur-fast), filter var(--dur-fast); -webkit-tap-highlight-color: transparent; }
.btn.primary { --lip: var(--accent-deep); --lip-h: 3px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { --lip-h: 0px; background: transparent; border-color: transparent; color: var(--accent); padding-inline: 10px; }
.btn.danger { color: var(--red); }
.btn.sm { --lip-h: 2px; padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.sm.ghost { --lip-h: 0px; }
.btn:hover { transform: translateY(-1px); border-color: var(--ink-3); }
.btn.primary:hover { filter: brightness(1.07); border-color: var(--accent); }
.btn.ghost:hover { transform: none; background: var(--accent-soft); border-color: transparent; }
.btn:active { --lip-h: 0px; transform: translateY(2px); }
.btn.ghost:active { transform: scale(.97); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; pointer-events: none; --lip-h: 0px; transform: none; }
.btn .kbd { font-weight: 600; font-size: 11.5px; color: inherit; border-color: currentColor; opacity: .7; }
.kbd { font: 600 11.5px/1 var(--f-ui); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--rule-2); color: var(--ink-3); }

input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  background: var(--surface); border: 1.5px solid var(--rule-2); border-radius: 10px; padding: 9px 12px; min-width: 0; transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
/* Fields light up in blue ink when you type in them; ticks, radios and sliders show a ring from the keyboard only. */
input:focus, select:focus, textarea:focus { outline: none; }
input:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, input[type="search"]:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type="text"]:focus-visible, input[type="number"]:focus-visible, input[type="date"]:focus-visible, input[type="search"]:focus-visible { outline: none; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
label.field { display: grid; gap: 5px; font-size: 13.5px; color: var(--ink-2); font-weight: 700; }
label.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
label.check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--green); flex: none; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.bad { background: var(--red-soft); color: var(--red); }
.pill.warn { background: var(--amber-soft); color: var(--amber); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
/* A rule or topic name in a pill (a drill's review, the mixed review's topic) can be long: it wraps instead of widening the page. */
.misses .pill, .drill-q .pill { white-space: normal; border-radius: 10px; }

.sk { --c: var(--sk-bil); display: inline-flex; align-items: center; gap: 5px; font: 800 10.5px/1 var(--f-ui); letter-spacing: .07em; padding: 4px 8px 4px 6px; border-radius: 8px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); white-space: nowrap; }
.sk .ico { width: 14px; height: 14px; stroke-width: 2; --pen: currentColor; }
.sk.voc { --c: var(--sk-voc); } .sk.gra { --c: var(--sk-gra); } .sk.co { --c: var(--sk-co); } .sk.ce { --c: var(--sk-ce); }
.sk.ee { --c: var(--sk-ee); } .sk.eo { --c: var(--sk-eo); } .sk.bil { --c: var(--sk-bil); }

/* A fold: a short label with a chevron that opens in place ("Comment faire · How it works", "Notes"…). */
.fold-x > summary { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; list-style: none; padding: 3px 6px; margin-left: -6px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-3); transition: color var(--dur-fast), background-color var(--dur-fast); }
.fold-x > summary::-webkit-details-marker { display: none; }
.fold-x > summary::after, .chev { content: ""; display: inline-block; flex: none; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform var(--dur) var(--ease); }
.fold-x[open] > summary::after, details[open] > summary .chev { transform: translateY(1px) rotate(-135deg); }
.fold-x > summary:hover { color: var(--ink); background: var(--hover); }
.fold-x > :not(summary) { margin-top: 8px; }

/* ---------- brand kit: icons, the é tile, Rémy, stamps, the streak leaf, the boarding pass ---------- */
/* Icons: 24 px grid, 1.75 stroke, round ends, in the text colour with one red-pen detail (.pen). */
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; overflow: visible; }
.pen { stroke: var(--pen, currentColor); }
.pen-solid { fill: var(--pen, currentColor); stroke: none; }
.with-ico { display: flex; align-items: center; gap: 8px; }
.with-ico > .ico { width: 20px; height: 20px; }
.h3.with-ico { gap: 7px; }
.h3.with-ico > .ico { width: 18px; height: 18px; }
.with-ico > .leaf-ico { width: 17px; height: 18px; flex: none; }
.tabs .ico { width: 17px; height: 17px; margin-right: 7px; vertical-align: -3px; color: var(--ink-3); --pen: currentColor; }
.tabs [aria-selected="true"] .ico { color: var(--ink); --pen: var(--red); }
.tile { display: block; }
.t-bg { fill: var(--tile-bg); }
.t-l1 { fill: none; stroke: var(--tile-l1); stroke-width: .9; }
.t-l2 { fill: none; stroke: var(--tile-l2); stroke-width: 1.3; }
.t-m { fill: none; stroke: var(--tile-m); stroke-width: 1.6; }
.t-edge { fill: none; stroke: var(--tile-edge); stroke-width: 1.5; }
.t-e { fill: none; stroke: var(--tile-e); stroke-linecap: round; stroke-linejoin: round; }
.t-leaf { fill: var(--tile-leaf); }
/* Rémy, le petit chef */
.mascot { display: block; overflow: visible; }
.r-fur { fill: var(--fur); } .r-dark { fill: var(--fur-dark); } .r-belly { fill: var(--muzzle); } .r-earin { fill: var(--ear-in); }
.r-eye { fill: var(--m-ink); } .r-glint { fill: #FFFFFF; } .r-nose { fill: var(--m-nose); } .r-noseshine { fill: #FFFFFF; opacity: .45; }
.r-tooth { fill: var(--tooth); stroke: var(--m-ink); stroke-width: .9; }
.r-line { fill: none; stroke: var(--m-ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.r-thick { stroke-width: 2.6; }
.r-mouth { fill: #8E3B34; stroke: var(--m-ink); stroke-width: 1.4; stroke-linejoin: round; }
.r-blush { fill: var(--blush); opacity: .5; }
.r-whisk { fill: none; stroke: var(--fur-dark); stroke-width: 1.1; stroke-linecap: round; }
.r-tail { fill: none; stroke: var(--tail); stroke-width: 3.6; stroke-linecap: round; }
.r-feet { fill: var(--tail); }
.r-scarf { fill: #C62F24; }
.r-toque { fill: #FFFFFF; stroke: #C9CFD7; stroke-width: 1.4; stroke-linejoin: round; }

.k-hp { fill: none; stroke: #0E7490; stroke-width: 5; stroke-linecap: round; } .k-hpc { fill: #0E7490; }
.k-glass { fill: rgba(255, 255, 255, .18); stroke: #16181D; stroke-width: 2; stroke-linecap: round; }
.k-penbody { fill: #C62F24; } .k-pencap { fill: #8F1F18; } .k-pentip { fill: #F3E3D3; stroke: #8F1F18; stroke-width: .8; }
.k-mug { fill: #FFFFFF; stroke: #2B1D15; stroke-width: 1.6; } .k-mugh { fill: none; stroke: #2B1D15; stroke-width: 1.6; } .k-mugleaf { fill: #C62F24; }
.k-steam { fill: none; stroke: var(--ink-3); stroke-width: 1.6; stroke-linecap: round; }
.k-c1 { fill: var(--leaf-2); } .k-c2 { fill: var(--leaf-3); } .k-c3 { fill: var(--leaf-1); } .k-c4 { fill: var(--leaf-4); }
/* Rémy is alive: he blinks, twitches an ear and swishes his tail, and hops when he cheers. Every cycle runs on one
   clock (motion.js sets --clock after each redraw), so redrawing the page doesn't restart them. */
.mascot .r-eyes, .mascot .r-ear, .mascot .r-tail { transform-box: fill-box; }
.mascot .r-eyes { transform-origin: 50% 50%; animation: r-blink 5.2s var(--clock, 0ms) infinite; }
.mascot .r-ear-l { transform-origin: 87% 83%; animation: r-ear-l 7.4s var(--clock, 0ms) infinite; }
.mascot .r-ear-r { transform-origin: 13% 83%; animation: r-ear-r 9.1s var(--clock, 0ms) infinite; }
.mascot .r-tail { transform-origin: 0% 82%; animation: r-tail 3.8s var(--clock, 0ms) ease-in-out infinite; }
.mascot.m-bravo { transform-origin: 50% 100%; animation: r-hop 2.6s var(--clock, 0ms) infinite; }
@keyframes r-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes r-ear-l { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-9deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(0); } }
@keyframes r-ear-r { 0%, 58%, 100% { transform: rotate(0); } 62% { transform: rotate(8deg); } 66% { transform: rotate(-2deg); } 70% { transform: rotate(0); } }
@keyframes r-tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-9deg); } }
@keyframes r-hop { 0%, 34%, 100% { transform: none; } 8% { transform: translateY(-5px); } 16% { transform: none; } 24% { transform: translateY(-3px); } }
.bubble { position: relative; background: var(--sunk); border-radius: 16px; padding: 10px 13px 11px; font: 400 15px/1.4 var(--f-text); color: var(--ink); }

.greet { display: flex; align-items: flex-end; gap: 4px; }

.greet.sm .mascot { width: 58px; }

/* The streak leaf turns like a Québec autumn the longer the streak runs. */
.streak { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px; border-radius: 999px; font: 800 12.5px/1 var(--f-ui); color: var(--ink); white-space: nowrap; justify-self: start; }
.streak svg { width: 15px; height: 16px; }
.streak.t1 { background: color-mix(in srgb, var(--leaf-1) 16%, transparent); } .streak.t1 svg, .leaf-ico.t1 { fill: var(--leaf-1); }
.streak.t2 { background: color-mix(in srgb, var(--leaf-2) 16%, transparent); } .streak.t2 svg, .leaf-ico.t2 { fill: var(--leaf-2); }
.streak.t3 { background: color-mix(in srgb, var(--leaf-3) 16%, transparent); } .streak.t3 svg, .leaf-ico.t3 { fill: var(--leaf-3); }
.streak.t4 { background: color-mix(in srgb, var(--leaf-4) 16%, transparent); } .streak.t4 svg, .leaf-ico.t4 { fill: var(--leaf-4); }

/* Stamps to collect: earned ones sit a little crooked; the ones still to earn wait in grey. */
.stamps { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 18px 10px; }

/* "Journée validée": a stamp lands on the day's header once every block is ticked. */

.pass { display: grid; grid-template-columns: minmax(0, 1fr) 150px; border: 1px solid var(--rule-2); border-radius: var(--r-card); background: var(--surface); overflow: hidden; max-width: 760px; box-shadow: var(--shadow); }

.pass-stub::before, .pass-stub::after { content: ""; position: absolute; left: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule-2); }
.pass-stub::before { top: -11px; } .pass-stub::after { bottom: -11px; }

@media (max-width: 620px) {

}

.mini-pass:hover { border-color: var(--rule-2); transform: translateY(-1px); }
.mini-pass .top { display: flex; justify-content: space-between; gap: 6px; font: 800 9.5px/1.2 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

.mini-pass svg { width: 100%; height: auto; display: block; }
/* L'expression du jour: a new saying every morning on a scrap of notebook paper. */
.note-card { --mx: 48px; position: relative; transform: rotate(-1.2deg); padding: 30px 18px 16px 64px; border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); display: grid; gap: 0; margin: 10px 0 0; transition: transform var(--dur) var(--ease); }

/* Tabs and segmented buttons: a tray with the current one raised out of it. */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--sunk); overflow-x: auto; width: fit-content; max-width: 100%; scrollbar-width: none; }

.notice.warn { background: var(--amber-soft); color: var(--ink); }
.empty { padding: 22px; border: 1.5px dashed var(--rule-2); border-radius: var(--r-card); color: var(--ink-3); text-align: center; }
/* Rémy waits in an empty box, centred, with his line read left to right. */
.empty .greet { justify-content: center; text-align: left; color: var(--ink); }

.bar { height: 8px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: inherit; }

/* red-pen corrections */

.pen-ok { font-family: var(--f-hand); color: var(--green); font-size: 14.5px; }

  background-color: var(--surface);

    linear-gradient(90deg, transparent var(--mx, 55px), var(--margin) var(--mx, 55px), var(--margin) calc(var(--mx, 55px) + 1.5px), transparent calc(var(--mx, 55px) + 1.5px)),

/* The notebook header: the date and phase on the left; the day's ring (or its stamp, once the day is done) and

.head-side { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 18px; }
.head-side > .tb-stamp { align-self: center; margin: 4px 6px; }

@media (max-width: 640px) {
  .cahier-head { --mx: 40px; padding-left: 58px; padding-right: 16px; }
  .head-side .greet .mascot { width: 58px; }
  .head-side .greet .bubble { margin-bottom: 28px; }

}
.date-hand { font: 400 clamp(20px, 3.2vw, 27px)/64px var(--f-hand); color: var(--ink); text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 12px; }

.rg-fill.empty { stroke: transparent; }
.rg-n { position: absolute; inset: 0; display: grid; place-items: center; font: 800 20px/1 var(--f-ui); font-variant-numeric: tabular-nums; color: var(--ink); }

.daychips::-webkit-scrollbar { display: none; }
.daychip { display: grid; justify-items: center; gap: 1px; min-width: 56px; padding: 8px 8px 7px; border-radius: 14px; border: 1.5px solid var(--rule); background: var(--surface); cursor: pointer; color: var(--ink-2); font-size: 12px; font-weight: 700; transition: transform var(--dur-fast) var(--ease), border-color var(--dur-fast), box-shadow var(--dur-fast), background-color var(--dur-fast); -webkit-tap-highlight-color: transparent; }
.daychip:hover { transform: translateY(-1px); border-color: var(--rule-2); box-shadow: var(--shadow-sm); }

.daychip[aria-pressed="true"] b { color: var(--accent); }
.daychip.is-today b { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 3px; }
/* The day's blocks. The next one to do is open, with its details and a big Start; the others show their title and
   open with a tap; done ones shrink to a ticked line. */

.block { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 11px 14px 11px 12px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.block:hover { border-color: var(--rule-2); }

.block .tick input, .tick input { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin: 0; border-radius: 50%; border: 2px solid var(--rule-2); background: var(--surface); cursor: pointer; transition: background-color var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast) var(--ease); }
.tick:hover input { border-color: var(--green); transform: scale(1.06); }
.tick input:checked { background: var(--green); border-color: var(--green); }
.tick-mark { position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; fill: none; stroke: var(--on-green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; opacity: 0; }
.tick-mark path { stroke-dasharray: 18; }
.tick input:checked + .tick-mark { opacity: 1; }
.block-main { min-width: 0; }
.block-main > summary { list-style: none; cursor: pointer; border-radius: 10px; }
.block-main > summary::-webkit-details-marker { display: none; }
.block-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.block-top h3 { font: 700 16px/1.3 var(--f-ui); }
.block-top .min { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.block-top .chev { color: var(--ink-3); }
.block-main > summary:hover .chev { color: var(--ink); }

.block .check { font-size: 13.5px; color: var(--ink-2); }
.block .check span { font-weight: 800; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--green); margin-right: 6px; }

  .block.next > .btn { grid-column: 2; justify-self: start; }
}
.side { display: grid; gap: 18px; }
.side .panel { padding: 18px; }
.hw { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.hw li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.hw li:last-child { border-bottom: 0; }
.hw li input { width: 18px; height: 18px; accent-color: var(--green); margin-top: 2px; }
.hw li.done span { color: var(--ink-3); text-decoration: line-through; }
.hw li small { display: block; color: var(--ink-3); font-size: 12px; }
.x { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 3px 6px; border-radius: 8px; transition: color var(--dur-fast), background-color var(--dur-fast); }
.x:hover { color: var(--red); background: var(--red-soft); }
.heat { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; }
.heat i { border-radius: 3px; background: var(--sunk); }

/* ---------- grammar ---------- */
/* The three ways to practise across topics, as tiles. */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

.tile-card { position: relative; display: grid; align-content: start; gap: 6px; padding: 18px 40px 16px 18px; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-sm); color: var(--ink); text-decoration: none; transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), border-color var(--dur-fast); -webkit-tap-highlight-color: transparent; }
.tile-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--rule-2); }

/* The topics, as one card of rows. */
.topics { list-style: none; margin: 0; padding: 0; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.topics li + li a { border-top: 1px solid var(--rule); }
.topics li a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 12px; gap: 4px 14px; align-items: center; padding: 13px 16px; text-decoration: none; color: var(--ink); transition: background-color var(--dur-fast); }
.topics li a::after { content: "›"; font-weight: 800; font-size: 18px; line-height: 1; color: var(--ink-3); transition: transform var(--dur) var(--ease), color var(--dur-fast); }
.topics li a:hover { background: var(--hover); }
.topics li a:hover::after { transform: translateX(3px); color: var(--accent); }
@media (max-width: 560px) { .topics li a { grid-template-columns: 26px minmax(0, 1fr) 12px; } .topics .meta { grid-column: 2; grid-row: 2; justify-content: flex-start; } }
/* A topic's notes: the rule, your mistakes and examples, each a fold. */
.notes { display: grid; gap: 6px; }
.topics .n { font: 800 15px/1 var(--f-ui); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.topics .t b { font-weight: 700; }
.topics .t small { display: block; color: var(--ink-3); font-size: 13px; }
.topics .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.set-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.set-row:last-child { border-bottom: 0; }
.lvl { display: inline-block; font: 800 11px/1 var(--f-ui); letter-spacing: .04em; padding: 4px 6px; border-radius: 6px; border: 1.5px solid var(--rule-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lvl.b2 { border-color: var(--ink); color: var(--ink); }
.mistakes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mistakes li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.examples { display: grid; gap: 10px; }
.examples div p:first-child { font: 400 17px/1.4 var(--f-text); }
.examples div p + p { font-size: 13.5px; color: var(--ink-3); }
.drill { display: grid; gap: 16px; }
.drill-q { display: grid; gap: 16px; }
.drill-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }

.blank { font: 400 21px/1.3 var(--f-text); border: 0 !important; border-bottom: 2px solid var(--accent) !important; border-radius: 6px 6px 0 0 !important; background: var(--accent-soft) !important; padding: 2px 8px !important; min-width: 7ch; max-width: 100%; box-shadow: none !important; }
.blank:focus { outline: none !important; background: var(--accent-soft); }
.blank.ok { border-bottom-color: var(--green) !important; background: var(--green-soft) !important; }
.blank.bad { border-bottom-color: var(--red) !important; background: var(--red-soft) !important; }

.accents { display: flex; flex-wrap: wrap; gap: 5px; }
.accents button { min-width: 34px; padding: 6px 7px; border: 1.5px solid var(--rule-2); border-radius: 9px; background: var(--surface); font: 400 15px/1 var(--f-text); cursor: pointer; box-shadow: 0 2px 0 var(--rule-2); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), border-color var(--dur-fast); }

.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.choices button { text-align: left; padding: 12px 14px; border: 1.5px solid var(--rule-2); border-radius: var(--r); background: var(--surface); font: 400 17px/1.3 var(--f-text); cursor: pointer; display: flex; gap: 10px; align-items: baseline; box-shadow: 0 2px 0 var(--rule-2); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), border-color var(--dur-fast), background-color var(--dur-fast); -webkit-tap-highlight-color: transparent; }

/* Find the mistakes: words marked in red pen, then found (green), missed (red) and fine but marked (crossed) */

.pr-n { display: inline-block; min-width: 1.5em; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 800 11px/1.6 var(--f-ui); text-align: center; }
.pr-text sup.pr-n { font-size: 10px; line-height: 1.5; margin-right: 2px; vertical-align: super; }
.pr-fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pr-fixes li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pr-fixes .blank { font-size: 18px; }
.pr-fix { color: var(--green); font-weight: 700; }
.scorebig { font: 800 46px/1 var(--f-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.history { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- vocab ---------- */
.flash { display: grid; gap: 18px; text-align: center; padding: 34px 24px 24px; }
.panel.flash { border-radius: var(--r-lg); }
.flash .prompt { font: 700 24px/1.3 var(--f-ui); }

/* ---------- writing ---------- */
.prompt-card { display: grid; gap: 10px; }

.docs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 700px) { .docs { grid-template-columns: minmax(0, 1fr); } }
.doc { padding: 16px 18px; border: 1px solid var(--rule); border-radius: 14px; background: var(--hover); display: grid; gap: 8px; align-content: start; }

textarea.seyes { border: 0; border-radius: 0; min-height: 416px; padding: 10px 20px 20px 72px; font: 400 17px/32px var(--f-text); color: var(--ink); resize: vertical; background-attachment: local; }

.meter { display: grid; gap: 5px; min-width: 220px; flex: 1; max-width: 360px; }

.meter .lab b { color: var(--ink); font-size: 15px; }
.meter .track { position: relative; height: 8px; border-radius: 999px; background: var(--sunk); }

.paras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; padding: 12px 16px 14px; border-top: 1px solid var(--rule); background: var(--surface); }
@media (max-width: 700px) { .paras { grid-template-columns: minmax(0, 1fr); } }

label.field.inline { grid-auto-flow: column; align-items: center; gap: 6px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.errs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.errs li { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.errs li .fix { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }

.corrected { font: 400 17px/32px var(--f-text); padding: 10px 20px 14px 72px; border-radius: 14px; border: 1px solid var(--rule); white-space: pre-wrap; }
.upgrades { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

/* ---------- comprehension ---------- */
.sheet { padding: 22px 24px; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); display: grid; gap: 12px; box-shadow: var(--shadow-sm); }

.opt:hover { border-color: var(--rule-2); }

.transcript { display: grid; gap: 6px; }

/* history tree: topic → set → attempt */
.tree { display: grid; gap: 8px; }

.lv { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); font: 800 11.5px/1.35 var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }

.miss { font-size: 12.5px; font-weight: 700; color: var(--red); white-space: nowrap; }

/* practice exam: the 1–39 navigator */

/* the CO practice exam: the phase strip, the drawing on notebook paper, the A–D buttons and the progress strip */
.cox-phase { gap: 12px; min-height: 30px; }

.letters { display: flex; flex-wrap: wrap; gap: 10px; }
.opt.letter { width: 64px; height: 56px; padding: 0; justify-content: center; align-items: center; position: relative; font: 800 22px/1 var(--f-ui); border-radius: 14px; box-shadow: 0 2px 0 var(--rule-2); }

.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

/* ---------- progress ---------- */
.criteria { list-style: none; margin: 0; padding: 0; display: grid; }

.bars .b .track i { display: block; height: 100%; background: var(--red); border-radius: 999px; }
.bars .b .c { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
table.nclc { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.nclc th, table.nclc td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; }
table.nclc th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; }
table.nclc tr.target td { background: var(--green-soft); font-weight: 700; }
.tag7 { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.tag7.ok { background: var(--green-soft); color: var(--green); }
.tag7.no { background: var(--red-soft); color: var(--red); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { padding: 15px 16px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-sm); }
.stat b { display: block; font: 800 28px/1.1 var(--f-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-3); }
.exam { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.exam div { padding: 15px 16px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); display: grid; gap: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); }
.toast-ghost { pointer-events: none; }
.thinking::after { content: "…"; animation: dots 1.2s steps(3, end) infinite; display: inline-block; width: 1em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1em; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- saving a word or phrase from any page ---------- */
/* The button under a selection, the panel that saves it, and the words already saved, marked like a highlighter pen. */
.grab-btn { position: absolute; z-index: 16; display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px 8px 11px; border: 1.5px solid var(--rule-2); border-radius: 999px; background: var(--surface); color: var(--ink); font: 700 13px/1 var(--f-ui); box-shadow: var(--shadow-lg); cursor: pointer; white-space: nowrap; }
.grab-btn:hover { border-color: var(--ink-3); }
.grab-btn .ico { width: 17px; height: 17px; }
.grab { position: fixed; right: 20px; bottom: 20px; z-index: 15; width: min(380px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow: auto; display: grid; gap: 12px; padding: 18px 20px; box-shadow: var(--shadow-lg); }
.grab-btn[hidden], .grab[hidden] { display: none; }
.grab-dup { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--sunk); }
.grab-dup .fr { font-size: 17px; }
@media (max-width: 640px) {
  .grab { left: 0; right: 0; bottom: 0; width: auto; max-height: 75vh; border-radius: 20px 20px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
@media (pointer: coarse) { .grab .kbd { display: none; } }
::highlight(saved) { background-color: #FFEC99; }
:root.dark ::highlight(saved) { background-color: #4D3C0F; }
.wait-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.wait-list > li { padding-top: 14px; border-top: 1px solid var(--rule); }
.wait-list > li:first-child { padding-top: 0; border-top: 0; }
.wait-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .wait-fields { grid-template-columns: minmax(0, 1fr); } }

/* ---------- motion (motion.js) ---------- */
/* For a moment after switching light and dark, colours fade instead of snapping (motion.js adds the class). */
:root.theme-fade, :root.theme-fade * { transition: background-color .35s ease, color .35s ease, border-color .35s ease, fill .35s ease, stroke .35s ease !important; }
/* The maple leaves that fly off a stamp or a perfect score. */
.m-burst { position: fixed; z-index: 40; width: 0; height: 0; pointer-events: none; }
.m-burst svg { position: absolute; left: -10px; top: -11px; width: 20px; height: 22px; overflow: visible; }
</style>
